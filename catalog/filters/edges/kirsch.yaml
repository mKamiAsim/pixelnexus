id: kirsch
name: Kirsch compass
aliases: [Kirsch]
family: edges
tags: [purpose:edge]
tier: core
engine: browser
phase: 5c
status: implemented-tested
planNotes: Eight directions.

summary: Turns one 3x3 mask in eight steps of 45 degrees and keeps the strongest response at each pixel.
purpose: Find edges and their direction to the nearest 45 degrees.
classification: {linearity: nonlinear, domain: spatial, operation: compass convolution}
output: image
representation: fixed-kernel
representationLabel: exact
representationSource: {path: web/src/core/filters/edges/compass.ts, symbol: KIRSCH_NORTH}
supportRadius: "1"
supportsMask: true
preview: live
channelScopes: [luminance, rgb]
colorHandling: >-
  By default the filter works on luma and gives a gray result. With RGB scope, each channel
  gets its own result.
boundary: Set by the Border mode parameter. The default is reflect 101.

params:
  - key: output
    label: Output
    type: select
    default: magnitude
    options:
      - {value: magnitude, label: Largest response}
      - {value: direction, label: Direction of the largest response}
    description: The strongest of the eight mask responses, or the direction of that mask.
    effect: Direction is a multiple of 45 degrees.
  - ref: outputMapping
    default: normalize
  - ref: border
  - ref: channelScope
    default: luminance

formula: |
  K_{\text{N}} = \begin{bmatrix} 5 & 5 & 5 \\ -3 & 0 & -3 \\ -3 & -3 & -3 \end{bmatrix},
  \qquad
  G = \max_{k = 0, \dots, 7} \bigl( K_k \star I \bigr)
formulaExplanation: >-
  The north mask weights the top row with 5 and the rest of the ring with -3. Moving its outer ring by one cell turns it by 45 degrees. The eight masks cover all directions, and the largest response is the edge strength. The mask that gives it is the direction.
symbols:
  - {symbol: 'K_k', meaning: The mask turned by k steps of 45 degrees}
  - {symbol: 'G', meaning: The largest response}
steps:
  - Pad the image with the border mode.
  - Correlate with each of the eight masks.
  - Keep the largest response, or the direction of the mask that gives it.
  - Map the result to 8 bits with the output mapping.
complexity:
  time: O(N)
  memory: O(N)
  notes: N is the number of pixels per channel. Eight 3x3 correlations per pixel.
useCases:
  - Find edges and their direction in one step.
  - Detect boundaries in medical images, where Kirsch first used it.
advantages:
  - Gives a direction without an arctangent.
  - Strong response to edges in all eight directions.
limitations:
  - The direction has only eight values.
  - Large weights make it sensitive to noise.
artifacts:
  - Thick edges and a coarse direction map.
references:
  - kind: paper
    text: Kirsch, R. A. Computer determination of the constituent structure of biological images. Computers and Biomedical Research 4(3), 315 to 328, 1971.
    doi: 10.1016/0010-4809(71)90034-6
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Section 10.2.
implementation: {path: web/src/core/filters/edges/compass.ts, symbol: kirschFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: Eight turned copies of one mask, and the strongest answer wins.
  howItWorks:
    - Correlate the image with the mask for each of eight directions.
    - Keep the strongest response as the edge strength.
    - The direction of that mask is the edge direction.
  academic: >-
    A compass gradient: the maximum over a set of rotated template matches. The weights 5 and -3 add up to 0, so flat areas give 0.
  paramNotes:
    output: The largest response or its direction.
  tryThis:
    - Show the direction output on the Disks image. Each disk shows eight colored sectors.
  pitfalls:
    - Expecting fine angles. The direction is a multiple of 45 degrees.
  demos: [impulse-response]
related: [robinson, sobel, frei-chen]
docsPage: filters/edges/kirsch.md
