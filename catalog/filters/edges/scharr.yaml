id: scharr
name: Scharr
aliases:
- Scharr X
- Scharr Y
family: edges
tags: [purpose:edge, purpose:gradient]
tier: core
engine: browser
phase: 5c
status: implemented-tested
planNotes: Scharr X and Y.

summary: Estimates the gradient with 3x3 kernels whose 3, 10, 3 smoothing makes the result nearly the same in every direction.
purpose: Find edges and their direction more accurately than Sobel, especially on diagonals.
classification: {linearity: linear, domain: spatial, operation: convolution}
output: image
representation: fixed-kernel
representationLabel: exact
representationSource: {path: web/src/core/filters/edges/gradients.ts, symbol: GRADIENT_PAIRS}
supportRadius: "1"
supportsMask: true
preview: live
channelScopes: [luminance, rgb]
colorHandling: >-
  By default the filter works on luma and gives a gray result. With RGB scope, each channel
  gets its own result.
boundary: Set by the Border mode parameter. The default is reflect 101.

params:
  - key: output
    label: Output
    type: select
    default: magnitude
    options:
      - {value: magnitude, label: Magnitude}
      - {value: gx, label: Horizontal change (Sx)}
      - {value: gy, label: Vertical change (Sy)}
      - {value: direction, label: Direction}
    description: Which part of the gradient to show.
    effect: The two derivatives are signed. Magnitude is never negative. Direction is an angle.
  - key: norm
    label: Magnitude norm
    type: select
    default: l2
    options:
      - {value: l2, label: L2 (square root of the sum of squares)}
      - {value: l1, label: L1 (sum of absolute values)}
    description: How the two derivatives are combined into the magnitude.
    effect: L1 gives slightly larger values on diagonal edges.
  - ref: outputMapping
    default: normalize
  - ref: border
  - ref: channelScope
    default: luminance

formula: |
  S_x = \begin{bmatrix} 3 \\ 10 \\ 3 \end{bmatrix} \begin{bmatrix} -1 & 0 & 1 \end{bmatrix},
  \qquad
  S_y = S_x^{\mathsf T}
formulaExplanation: >-
  A central difference across the edge and a 3, 10, 3 smoothing along it. Scharr chose these weights so that the error of the gradient direction is as small as possible for a 3x3 kernel. The weights are those of OpenCV's Scharr operator, without normalization.
symbols:
  - {symbol: 'S_x, S_y', meaning: The Scharr kernels}
steps:
  - Pad the image with the border mode.
  - Correlate with the difference along x and the 3, 10, 3 smoothing along y for G_x, and the reverse for G_y.
  - Combine G_x and G_y into the chosen output.
  - Map the result to 8 bits with the output mapping.
complexity:
  time: O(N)
  memory: O(N)
  notes: N is the number of pixels per channel. Each kernel runs as two passes of 3 taps.
useCases:
  - Estimate gradient directions for orientation analysis.
  - Find edges where diagonal accuracy matters.
advantages:
  - The most rotation invariant of the common 3x3 gradient kernels.
  - Separable and fast.
limitations:
  - The weights are large, so results need the output mapping.
  - Sensitive to noise, like all 3x3 derivatives.
artifacts:
  - Thick edges, two or three pixels wide.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Section 10.2.
  - kind: library
    text: OpenCV documentation, cv::Scharr.
    url: https://docs.opencv.org/4.x/d4/d86/group__imgproc__filter.html
implementation: {path: web/src/core/filters/edges/gradients.ts, symbol: scharrFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: Like Sobel, with weights chosen so the edge direction is measured more accurately.
  howItWorks:
    - Take the difference across the edge.
    - Average along the edge with the weights 3, 10, 3.
    - Combine the two directions into a strength and a direction.
  academic: >-
    A first-derivative operator optimized for rotation invariance of the gradient direction, within 3x3 support.
  paramNotes:
    output: The part of the gradient to show.
    norm: How the two derivatives combine into the magnitude.
  tryThis:
    - Compare the direction output of Sobel and Scharr on the Zone plate.
  pitfalls:
    - Comparing raw values with Sobel. Scharr's weights add up to more, so its values are larger.
  demos: [impulse-response, gradient-explorer]
related: [sobel, prewitt, farid-simoncelli]
docsPage: filters/edges/scharr.md
