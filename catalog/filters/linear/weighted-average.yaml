id: weighted-average
name: Weighted average filter
aliases:
- Custom kernel
- Convolution with your own kernel
family: linear
tags: [purpose:smoothing, purpose:edge, purpose:sharpening]
tier: core
engine: browser
phase: 5a
status: implemented-tested
planNotes: Editable kernel with normalization.

summary: Filters with a kernel that you type, divided by its sum when you ask.
purpose: Try any small linear filter, such as a classic textbook kernel, without writing code.
classification: {linearity: linear, domain: spatial, operation: convolution}
output: image
representation: dynamic-kernel
representationLabel: exact
representationSource: {path: web/src/core/filters/linear/weighted-average.ts, symbol: weightedKernel}
supportRadius: half the larger side of the kernel
supportsMask: true
preview: live
channelScopes: [rgb, luminance, chroma]
colorHandling: >-
  Red, green and blue are filtered with the same kernel. Alpha is kept. Kernels with negative
  weights give signed results, which the output mapping turns into 8-bit values.
boundary: Set by the Border mode parameter. The default is reflect 101.

params:
  - key: kernel
    label: Kernel
    type: kernel
    default: 1 2 1; 2 4 2; 1 2 1
    description: The weights, row by row. Separate rows with semicolons or new lines, and numbers with spaces or commas. Both sides must be odd, up to 15.
    effect: The center of the kernel is the pixel being computed.
  - key: normalize
    label: Normalize
    type: boolean
    default: true
    description: Divide the weights by their sum, so they add up to 1. Skipped when the sum is 0.
    effect: Keeps the brightness of flat areas. Turn it off for edge kernels whose weights add up to 0.
  - ref: outputMapping
    default: clip
  - ref: border
  - ref: channelScope

formula: |
  I_{\text{out}}(x,y) = \frac{1}{s} \sum_{j} \sum_{i} K(i,j)\, I(x+i,\, y+j),
  \qquad
  s =
  \begin{cases}
  \sum_{j} \sum_{i} K(i,j) & \text{if normalize is on and the sum is not } 0 \\
  1 & \text{otherwise}
  \end{cases}
formulaExplanation: >-
  The offsets i and j run over the kernel with its center cell at 0. Each output value is the
  weighted sum of the window under the kernel. Dividing by the sum s keeps flat areas at their
  value. The result can be negative for kernels with negative weights, and the output mapping
  decides how it is shown.
symbols:
  - {symbol: 'I', meaning: 'Input channel value'}
  - {symbol: 'I_{\text{out}}', meaning: 'Output channel value before the output mapping'}
  - {symbol: 'K(i,j)', meaning: 'The typed weight at offset (i, j) from the center cell'}
  - {symbol: 's', meaning: 'The divisor: the sum of the weights, or 1'}
steps:
  - Read the kernel text. If it cannot be read, use the default kernel and say why.
  - With normalize on and a nonzero sum, divide every weight by the sum.
  - Pad the image with the border mode and correlate it with the kernel, anchored at its center.
  - Map the result to 8 bits with the output mapping. Keep alpha unchanged.
complexity:
  time: O(N\,k_w\,k_h)
  memory: O(N)
  notes: N is the number of pixels per channel and k_w by k_h the kernel size.
useCases:
  - Try textbook kernels, such as `1 2 1; 2 4 2; 1 2 1` or a Sobel kernel.
  - Teach how each weight changes the result.
advantages:
  - Any linear filter up to 15x15, with the exact kernel shown in the Inspector.
limitations:
  - The filter runs the kernel directly, so large kernels are slow. Separable ones are faster as their own filters.
  - Correlation, not convolution. For a kernel that is not symmetric, flip it to get convolution.
artifacts:
  - Depends on the kernel. Negative weights make halos, and unnormalized kernels change brightness.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 3.
  - kind: library
    text: SciPy documentation, scipy.ndimage.correlate.
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.correlate.html
implementation: {path: web/src/core/filters/linear/weighted-average.ts, symbol: weightedAverageFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/linear/linear5a.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: You type the weights, and each pixel becomes the weighted sum of its neighbors.
  howItWorks:
    - Lay the kernel over the image with its center on the pixel.
    - Multiply each neighbor by the weight on top of it and add the results.
    - Divide by the sum of the weights when Normalize is on.
  academic: >-
    This is discrete correlation with an arbitrary kernel. Every linear, shift-invariant filter
    with a finite support has this form.
  paramNotes:
    kernel: The weights, row by row.
    normalize: Divide by the sum, so flat areas keep their brightness.
  tryThis:
    - Type `1 2 1; 2 4 2; 1 2 1` for a small blur.
    - Type `-1 0 1; -2 0 2; -1 0 1`, turn Normalize off and set the output mapping to Absolute value. You get vertical edges.
  pitfalls:
    - Forgetting that a kernel with weights adding up to 0 cannot be normalized. Turn Normalize off and pick an output mapping.
  demos: [neighborhood-stepper, impulse-response]
related: [box, gaussian, sobel, laplacian]
docsPage: filters/linear/weighted-average.md
