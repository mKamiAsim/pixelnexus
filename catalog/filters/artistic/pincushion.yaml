id: pincushion
name: Pincushion distortion
aliases: [Pincushion lens distortion]
family: artistic
tags: [purpose:geometry]
tier: core
engine: browser
phase: 5f
status: implemented-tested

summary: Bows straight lines inward, as telephoto lenses often do, by stretching the image more toward its edges.
purpose: Imitate the pincushion distortion of a telephoto lens.
classification: {linearity: linear, domain: geometric, operation: radial polynomial mapping}
output: image
representation: algorithm
representationLabel: exact
representationSource: {path: web/src/core/filters/artistic/distort.ts, symbol: polynomialSource}
supportRadius: global
supportsMask: true
preview: live
channelScopes: [rgb]
colorHandling: >-
  All channels move together, and alpha moves with them, so transparency stays with its colors.
boundary: >-
  Set by the Border mode parameter. The default is reflect 101. It fills positions that the
  mapping reads from outside the image. With the constant border they are black and transparent.
  The mapping depends on the position in the whole image, so the filter always runs on the whole
  image.

params:
  - key: strength
    label: Strength
    type: number
    min: 0
    max: 0.3
    step: 0.01
    default: 0.15
    description: The size of the negative coefficient k of the radial term.
    effect: Higher values bow lines more.
  - key: fit
    label: Keep corners
    type: boolean
    default: true
    description: Scale the mapping so the corners stay where they are.
    effect: Off lets the edges move in or out.
  - ref: border
formula: |
  r_s = \frac{r\, (1 - k\, r^2)}{1 - k},
  \qquad k = {{strength}}
formulaExplanation: >-
  This is the barrel mapping with a negative coefficient. The source radius grows slower than
  the output radius toward the edges, so the outer part of the image is stretched outward and
  straight lines bow inward. The strength stops at 0.3, below one third, because the mapping folds
  back on itself when 3 k r^2 reaches 1 at the corners. Keep corners divides by 1 - k so that the
  corners stay. Each output pixel reads the source at the mapped position with bilinear interpolation, the inverse mapping of Gonzalez and Woods, so no holes appear.
symbols:
  - {symbol: 'r', meaning: 'The distance of an output pixel from the image center, as a share of half the diagonal'}
  - {symbol: 'r_s', meaning: 'The distance of the source position it reads, in the same unit'}
  - {symbol: 'k', meaning: 'The strength, the size of the negative radial term'}
steps:
  - For each output pixel, find its distance r from the center.
  - Compute the source distance r (1 - k r^2), divided by 1 - k with Keep corners on.
  - Read the source there with bilinear interpolation, using the border mode outside the image.
complexity:
  time: O(N)
  memory: O(N)
  notes: N is the number of pixels. Each output pixel reads four source pixels.
useCases:
  - Imitating telephoto lenses.
  - Teaching the radial distortion model of camera calibration.
advantages:
  - The same model as camera calibration, with one coefficient.
limitations:
  - Limited to small strengths, so the mapping stays one to one.
artifacts:
  - Stretched, soft edges at high strengths.
references:
  - kind: library
    text: OpenCV documentation, camera calibration and the radial distortion coefficients.
    url: https://docs.opencv.org/4.x/d9/d0c/group__calib3d.html
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 2, geometric transformations and image interpolation.
implementation: {path: web/src/core/filters/artistic/distort.ts, symbol: pincushionFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts, web/src/core/filters/artistic/artistic.test.ts]
learn:
  oneSentence: Bow straight lines inward, as a telephoto lens does.
  howItWorks:
    - Measure how far each pixel is from the center.
    - Read the image from closer in, more so near the edges.
    - Optionally keep the corners where they are.
  academic: >-
    Radial distortion by the polynomial model with a negative first coefficient, applied by
    inverse mapping.
  paramNotes:
    strength: How strongly lines bow inward.
    fit: Keep the corners where they are.
    border: How positions outside the image are filled.
  tryThis:
    - Use the checkerboard test image at strength 0.3.
  pitfalls:
    - Expecting a strength above 0.3. The mapping would fold over itself.
  demos: [line-profile]
related: [barrel, fisheye]
docsPage: filters/artistic/pincushion.md
