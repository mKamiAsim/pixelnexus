id: opening
name: Opening
aliases: [Morphological opening]
family: morphology
tags: [purpose:morphology]
tier: core
engine: browser
phase: 5d
status: implemented-tested

summary: Erosion followed by dilation. It removes bright details smaller than the element and keeps the rest.
purpose: Remove small bright noise and thin bright structures while keeping larger objects at their size.
classification: {linearity: nonlinear, domain: spatial, operation: erosion then dilation}
output: image
representation: structuring-element
representationLabel: exact
representationSource: {path: web/src/core/filters/morphology/gray.ts, symbol: morphology}
supportRadius: 2 x iterations x the reach of the element
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  With RGB scope, each channel is processed on its own, which can create colors that were not
  in the image. Brightness only keeps the colors and works on luma.
boundary: >-
  Set by the Border mode parameter. The image is extended once by the full reach, so strips and
  whole images agree.

params:
  - key: element
    label: Structuring element
    type: structuring-element
    default: disk 1
    description: The shape and size of the neighborhood. Disk 1 is the 3 x 3 cross.
    effect: Larger elements change larger structures. The shape decides which structures fit.
  - key: iterations
    label: Iterations
    type: integer
    min: 1
    max: 10
    step: 1
    default: 1
    description: How many times each erosion or dilation runs.
    effect: More iterations act like a larger element of the same shape.
  - ref: border
  - ref: channelScope
    default: rgb

formula: |
  f \circ B = (f \ominus B) \oplus B
formulaExplanation: >-
  Erosion removes every bright detail the element does not fit into, and dilation brings the remaining objects back to their size. Erosion takes the smallest value of f(p + z) for z in B. Dilation takes the
  largest value of f(p - z), which uses the element turned by 180 degrees. Both match the
  grayscale erosion and dilation of SciPy. On an image of 0 and 255 they are binary erosion and
  dilation.
symbols:
  - {symbol: 'f', meaning: The image}
  - {symbol: 'B', meaning: The structuring element}
steps:
  - Extend the image by the reach of all steps with the border mode.
  - Erode with the element, once per iteration.
  - Dilate with the same element, once per iteration, and cut the extension off.
complexity:
  time: O(N K)
  memory: O(N)
  notes: N is the number of pixels per channel and K the number of pixels in the element, times the number of steps.
useCases:
  - Remove salt noise and small bright specks.
  - Separate objects joined by thin bridges.
  - Estimate the background for the top-hat.
advantages:
  - Keeps the size of objects the element fits into.
  - Idempotent, so a second opening changes nothing.
limitations:
  - Rounds the corners of bright objects to the element shape.
  - Does not remove dark noise.
artifacts:
  - Bright corners take on the shape of the element.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 9, morphological image processing.
  - kind: book
    text: Soille, P. Morphological Image Analysis, 2nd edition. Springer, 2004.
    doi: 10.1007/978-3-662-05088-0
  - kind: library
    text: SciPy documentation, scipy.ndimage.grey_erosion and grey_dilation.
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.grey_erosion.html
implementation: {path: web/src/core/filters/morphology/gray.ts, symbol: openingFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: Remove bright details that are too small for the element, and keep everything else.
  howItWorks:
    - Erode, so small bright details vanish.
    - Dilate, so larger objects grow back.
    - What the element fits into survives.
  academic: >-
    An anti-extensive, increasing and idempotent filter. Its result is the union of all translates of B that fit under f.
  paramNotes:
    element: The neighborhood shape and size.
    iterations: How many times each step runs.
  tryThis:
    - Add salt-and-pepper noise to the Disks image, then open it. The white specks go, the black ones stay.
  pitfalls:
    - Expecting it to remove dark noise. That is closing.
  demos: [line-profile]
related: [closing, erosion, dilation, tophat, opening-by-reconstruction]
docsPage: filters/morphology/opening.md
