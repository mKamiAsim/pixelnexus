id: erosion
name: Erosion
aliases: [Minimum filter with a structuring element, Grayscale erosion]
family: morphology
tags: [purpose:morphology]
tier: core
engine: browser
phase: 5d
status: implemented-tested

summary: Takes the smallest value under the structuring element, so dark areas grow and bright objects shrink.
purpose: Shrink bright objects, remove small bright details, and build the other morphology filters.
classification: {linearity: nonlinear, domain: spatial, operation: minimum over the structuring element}
output: image
representation: structuring-element
representationLabel: exact
representationSource: {path: web/src/core/filters/morphology/gray.ts, symbol: morphology}
supportRadius: iterations x the reach of the element
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  With RGB scope, each channel is processed on its own, which can create colors that were not
  in the image. Brightness only keeps the colors and works on luma.
boundary: >-
  Set by the Border mode parameter. The image is extended once by the full reach, so strips and
  whole images agree.

params:
  - key: element
    label: Structuring element
    type: structuring-element
    default: disk 1
    description: The shape and size of the neighborhood. Disk 1 is the 3 x 3 cross.
    effect: Larger elements change larger structures. The shape decides which structures fit.
  - key: iterations
    label: Iterations
    type: integer
    min: 1
    max: 10
    step: 1
    default: 1
    description: How many times each erosion or dilation runs.
    effect: More iterations act like a larger element of the same shape.
  - ref: border
  - ref: channelScope
    default: rgb

formula: |
  (f \ominus B)(p) = \min_{z \in B} f(p + z)
formulaExplanation: >-
  Each pixel becomes the smallest value under the element placed on it. Erosion takes the smallest value of f(p + z) for z in B. Dilation takes the
  largest value of f(p - z), which uses the element turned by 180 degrees. Both match the
  grayscale erosion and dilation of SciPy. On an image of 0 and 255 they are binary erosion and
  dilation.
symbols:
  - {symbol: 'f', meaning: The image}
  - {symbol: 'B', meaning: The structuring element}
steps:
  - Extend the image by the reach of all steps with the border mode.
  - Take the smallest value under the element at each pixel.
  - Repeat for each iteration, and cut the extension off.
complexity:
  time: O(N K)
  memory: O(N)
  notes: N is the number of pixels per channel and K the number of pixels in the element, times the number of steps.
useCases:
  - Remove small bright specks and thin bright lines.
  - Separate objects that touch.
  - The first step of opening and of the gradients.
advantages:
  - Simple, and the element controls exactly what is removed.
  - Works on binary and grayscale images.
limitations:
  - Shrinks every object, not only the noise.
  - Dark noise grows.
artifacts:
  - Objects take on the shape of the element at their corners.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 9, morphological image processing.
  - kind: book
    text: Soille, P. Morphological Image Analysis, 2nd edition. Springer, 2004.
    doi: 10.1007/978-3-662-05088-0
  - kind: library
    text: SciPy documentation, scipy.ndimage.grey_erosion and grey_dilation.
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.grey_erosion.html
implementation: {path: web/src/core/filters/morphology/gray.ts, symbol: erosionFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: Each pixel takes the darkest value around it, so bright shapes shrink.
  howItWorks:
    - Place the element on a pixel.
    - Look at the values it covers.
    - Keep the smallest one.
  academic: >-
    The infimum of translates of f by the points of B. It is the dual of dilation and an increasing, anti-extensive operation.
  paramNotes:
    element: The neighborhood shape and size.
    iterations: How many times each step runs.
  tryThis:
    - Erode the Disks image with disk 2 and watch the smallest dots disappear.
  pitfalls:
    - Expecting noise to vanish without the objects shrinking. Opening restores their size.
  demos: [morphology-stepper, line-profile]
related: [dilation, opening, internal-gradient, min]
docsPage: filters/morphology/erosion.md
