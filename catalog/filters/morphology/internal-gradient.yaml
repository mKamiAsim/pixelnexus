id: internal-gradient
name: Internal gradient
aliases: [Inner gradient]
family: morphology
tags: [purpose:morphology]
tier: core
engine: browser
phase: 5d
status: implemented-tested

summary: The image minus its erosion. It marks the inner side of bright edges.
purpose: Find the boundary pixels directly inside bright objects.
classification: {linearity: nonlinear, domain: spatial, operation: image minus erosion}
output: image
representation: structuring-element
representationLabel: exact
representationSource: {path: web/src/core/filters/morphology/gray.ts, symbol: morphology}
supportRadius: iterations x the reach of the element
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  With RGB scope, each channel is processed on its own, which can create colors that were not
  in the image. Brightness only keeps the colors and works on luma.
boundary: >-
  Set by the Border mode parameter. The image is extended once by the full reach, so strips and
  whole images agree.

params:
  - key: element
    label: Structuring element
    type: structuring-element
    default: disk 1
    description: The shape and size of the neighborhood. Disk 1 is the 3 x 3 cross.
    effect: Larger elements change larger structures. The shape decides which structures fit.
  - key: iterations
    label: Iterations
    type: integer
    min: 1
    max: 10
    step: 1
    default: 1
    description: How many times each erosion or dilation runs.
    effect: More iterations act like a larger element of the same shape.
  - ref: border
  - ref: channelScope
    default: rgb

formula: |
  f - (f \ominus B)
formulaExplanation: >-
  It is 0 in flat areas and positive on the bright side of edges. Erosion takes the smallest value of f(p + z) for z in B. Dilation takes the
  largest value of f(p - z), which uses the element turned by 180 degrees. Both match the
  grayscale erosion and dilation of SciPy. On an image of 0 and 255 they are binary erosion and
  dilation.
symbols:
  - {symbol: 'f', meaning: The image}
  - {symbol: 'B', meaning: The structuring element}
steps:
  - Extend the image by the reach of the steps with the border mode.
  - Erode with the element.
  - Subtract the erosion from the image, and cut the extension off.
complexity:
  time: O(N K)
  memory: O(N)
  notes: N is the number of pixels per channel and K the number of pixels in the element, times the number of steps.
useCases:
  - Inner outlines of objects in binary images.
  - Edges that stay inside objects.
advantages:
  - Edges lie on the object, not on the background.
limitations:
  - Only one side of each edge.
artifacts:
  - Thick inner borders for large elements.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 9, morphological image processing.
  - kind: book
    text: Soille, P. Morphological Image Analysis, 2nd edition. Springer, 2004.
    doi: 10.1007/978-3-662-05088-0
  - kind: library
    text: SciPy documentation, scipy.ndimage.grey_erosion and grey_dilation.
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.grey_erosion.html
implementation: {path: web/src/core/filters/morphology/gray.ts, symbol: internalGradientFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: The image minus its erosion, which leaves the inner rim of bright objects.
  howItWorks:
    - Erode the image.
    - Subtract the erosion from the image.
    - What remains is the inner border.
  academic: >-
    Half of Beucher's gradient. On a binary image it gives the boundary pixels of the objects.
  paramNotes:
    element: The neighborhood shape and size.
    iterations: How many times each step runs.
  tryThis:
    - Show the internal gradient of a thresholded image with disk 1 to get one-pixel outlines.
  pitfalls:
    - Expecting the outer border. That is the external gradient.
  demos: [line-profile]
related: [external-gradient, morph-gradient, erosion]
docsPage: filters/morphology/internal-gradient.md
