id: noise-periodic
name: Add periodic noise
aliases: [Sinusoidal noise, Periodic interference]
family: utility
tags: [purpose:simulation]
tier: core
engine: browser
phase: 5e
status: implemented-tested
planNotes: Noise lab.

summary: Adds a sine wave of one frequency and direction to every pixel, a model of periodic interference.
purpose: Make test images with periodic noise for the notch filters and periodic noise suppression.
classification: {linearity: linear, domain: spatial, operation: additive sine wave}
output: image
representation: random-process
representationLabel: exact
representationSource: {path: web/src/core/filters/frequency/notch.ts, symbol: noisePeriodicFilter}
supportRadius: "0"
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  The same wave goes to red, green and blue, so the noise is gray. With the brightness scope it
  goes to luma only. Alpha is kept. Results are clipped to 0 to 255.
boundary: Not needed. Each pixel depends only on its own value and position.

params:
  - key: amplitude
    label: Amplitude
    type: number
    min: 0
    max: 128
    step: 1
    default: 40
    unit: levels
    description: The height A of the wave, in 8-bit levels.
    effect: Larger values give stronger stripes.
  - key: fx
    label: Frequency x
    type: number
    min: -0.5
    max: 0.5
    step: 0.001
    default: 0.125
    unit: cycles/px
    description: How many waves fit in one pixel along x. 0.125 means a wave every 8 pixels.
    effect: Higher values give narrower stripes across x.
  - key: fy
    label: Frequency y
    type: number
    min: -0.5
    max: 0.5
    step: 0.001
    default: 0
    unit: cycles/px
    description: How many waves fit in one pixel along y.
    effect: With both frequencies set, the stripes run at an angle.
  - key: phase
    label: Phase
    type: angle
    min: 0
    max: 360
    step: 1
    default: 0
    unit: deg
    description: Where the wave starts at the top left pixel.
    effect: Moves the stripes without changing them.
  - ref: channelScope
    default: rgb

formula: |
  I_{\text{out}}(x, y) = I(x, y) + A \sin\left(2\pi (f_x x + f_y y) + \varphi\right),\quad A = {{amplitude}},\ f_x = {{fx}},\ f_y = {{fy}}
formulaExplanation: >-
  x and y are the image position of the pixel, so a region gives the same noise as the whole
  image. The wave makes two peaks in the spectrum, at (f_x, f_y) and at (-f_x, -f_y). This is
  the model of periodic noise in Gonzalez and Woods. Results outside 0 to 255 are clipped.
symbols:
  - {symbol: 'A', meaning: The amplitude in 8-bit levels}
  - {symbol: 'f_x, f_y', meaning: The frequency in cycles per pixel}
  - {symbol: '\varphi', meaning: The phase}
steps:
  - For each pixel, compute the wave at its image position.
  - Add it to the value.
  - Clip to 0 to 255 and round. Keep alpha unchanged.
complexity:
  time: O(N)
  memory: O(N)
  notes: N is the number of pixels.
useCases:
  - Test images for notch filters and periodic noise suppression.
  - Showing how a pattern looks in the spectrum.
advantages:
  - The frequency is known exactly, so a notch can be placed on it.
limitations:
  - Real interference often has several frequencies and changing strength. This is one pure wave.
artifacts:
  - Clipping flattens the wave in very dark and very bright areas.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 5, periodic noise and its reduction.
implementation: {path: web/src/core/filters/frequency/notch.ts, symbol: noisePeriodicFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: Lay a pattern of soft stripes over the image.
  howItWorks:
    - Compute a sine wave with the chosen frequency and direction at each pixel.
    - Add it to the pixel value.
  academic: >-
    Additive sinusoidal interference, the standard model of periodic noise. Its spectrum is a
    pair of impulses at plus and minus the wave frequency.
  paramNotes:
    amplitude: How strong the stripes are.
    fx: The frequency across x.
    fy: The frequency across y.
    phase: Where the stripes start.
  tryThis:
    - Add the noise, then open the Spectrum panel and find its two peaks.
  pitfalls:
    - A frequency close to 0.5 cycles per pixel. The stripes then alternate pixel by pixel and are hard to see.
  demos: [line-profile]
related: [notch-reject, comb, periodic-noise]
docsPage: filters/utility/noise-periodic.md
