id: frangi
name: Frangi vesselness
aliases: [Ridge filters, Vesselness, Frangi filter]
family: features
tags: [purpose:analysis, purpose:segmentation]
tier: advanced
engine: science
phase: 6d
status: implemented-tested
planNotes: Ridge filters are cross-listed here.

summary: Finds lines and vessels from the curvature of the image at several scales, with the vesselness measure of Frangi et al. Each pixel gets a value from 0 to 1 for how much it looks like the middle of a line.
purpose: Enhance blood vessels, cracks, wrinkles, fibers and other line-shaped structures before thresholding or tracing.
classification: {linearity: nonlinear, domain: spatial, operation: Hessian eigenvalue vesselness}
output: image
representation: algorithm
representationLabel: exact
representationSource: {path: engine/src/pixelnexus_engine/filters/ridges.py, symbol: ridge_representation}
supportRadius: global
supportsMask: true
preview: on-demand
channelScopes: [luminance, rgb]
colorHandling: >-
  By default the filter works on luma, with the BT.709 weights, and gives a gray result. With
  the RGB scope, each channel is filtered on its own. In retinal photos the green channel often
  shows vessels best. Alpha is kept.
boundary: Set by the Border mode parameter. The default is reflect, as in scikit-image. It fills the Gaussian derivatives past the edge.
dependencies:
  - {name: scikit-image, optional: false, note: 'skimage.filters.frangi and the Hessian (skimage.feature.hessian_matrix).'}

params:
  - key: ridges
    label: Ridges
    type: select
    default: dark
    options:
      - {value: dark, label: Dark ridges}
      - {value: bright, label: Bright ridges}
    description: Whether the lines to find are darker or brighter than their surroundings. Vessels in retinal photos are dark.
    effect: The wrong choice finds the gaps between lines instead.
  - key: sigmaMin
    label: Smallest scale
    type: number
    min: 0.5
    max: 20
    step: 0.5
    default: 1
    unit: px
    description: The smallest Gaussian sigma. A line of width w responds most near sigma = w / 2 or a little less.
    effect: Smaller values find thinner lines, and also more noise.
  - key: sigmaMax
    label: Largest scale
    type: number
    min: 0.5
    max: 20
    step: 0.5
    default: 9
    unit: px
    description: The largest Gaussian sigma. If it is below the smallest scale, only the smallest is used.
    effect: Larger values also find wide lines, and take longer.
  - key: sigmaStep
    label: Scale step
    type: number
    min: 0.5
    max: 10
    step: 0.5
    default: 2
    unit: px
    description: The step between the scales. The defaults give 1, 3, 5, 7 and 9, the scikit-image defaults.
    effect: Smaller steps try more scales and take longer.
  - key: beta
    label: Beta
    type: number
    min: 0.1
    max: 2
    step: 0.05
    default: 0.5
    description: How strongly round blobs are suppressed, through R_B = |lambda_1| / lambda_2. The paper uses 0.5.
    effect: Smaller values keep only long, thin lines.
  - key: gamma
    label: Gamma
    type: number
    min: 0
    max: 200
    step: 1
    default: 0
    description: The structure scale, in pixel levels per pixel squared. Responses with S well below gamma are suppressed. 0 uses half of the largest S at each scale, as scikit-image does.
    effect: Larger values ignore weak lines and noise.
  - ref: border
    default: reflect
  - ref: channelScope
    default: luminance
formula: |
  V_\sigma = \exp\!\left(-\frac{R_B^2}{2\beta^2}\right)\left(1 - \exp\!\left(-\frac{S^2}{2\gamma^2}\right)\right),
  \qquad
  R_B = \frac{\lvert\lambda_1\rvert}{\lambda_2},\quad S = \sqrt{\lambda_1^2 + \lambda_2^2},
  \qquad
  \beta = {{beta}}
formulaExplanation: >-
  The Hessian is the matrix of second derivatives of the image smoothed by a Gaussian of sigma.
  Its eigenvalues lambda_1 and lambda_2 are the curvatures along and across the strongest bend.
  They are sorted so that |lambda_1| <= |lambda_2|. In the middle of a dark line, the brightness bends up strongly
  across the line, so lambda_2 is large and positive. It hardly bends along the line, so lambda_1
  is near 0. Frangi's measure is large exactly there. The ratio R_B is near 1 for round blobs, so
  the first factor removes them. S is large wherever there is structure at all, so the second
  factor removes flat noise. Where lambda_2 has the wrong sign, scikit-image clips it to 1e-10,
  so V is 0. The 3D plate term of the paper is 1 in 2D. The filter keeps the largest V over the
  scales and stretches the result so the strongest response is white.
symbols:
  - {symbol: '\lambda_1, \lambda_2', meaning: 'The Hessian eigenvalues, |lambda_1| <= |lambda_2|'}
  - {symbol: 'R_B', meaning: 'The blob ratio'}
  - {symbol: 'S', meaning: 'The structure, the norm of the Hessian'}
  - {symbol: '\beta, \gamma', meaning: 'The blob and structure constants'}
steps:
  - Compute the Hessian with Gaussian derivatives at each scale.
  - Find its eigenvalues at each pixel, sorted by size.
  - Combine them into the vesselness V.
  - Keep the largest V over the scales and stretch it to the full range.
complexity:
  time: O(K N sigma)
  memory: O(N)
  notes: N is the number of pixels, K the number of scales and sigma the largest scale. The Gaussian derivatives are separable, and their windows reach 8 sigma.
useCases:
  - Blood vessels in retinal and angiography images.
  - Cracks in concrete, roads and metal.
  - Fibers, hairs and wrinkles.
advantages:
  - Ignores round blobs and flat areas.
  - Finds lines of many widths at once.
limitations:
  - Line crossings and branch points respond weakly, since they look like blobs.
  - The measure has no scale normalization in scikit-image. With many scales, wide lines respond far more weakly than thin ones, so set the smallest scale higher to find wide lines. The worked example shows it.
artifacts:
  - Edges of large bright areas can show as thin double lines.
references:
  - kind: paper
    text: Frangi, A. F., Niessen, W. J., Vincken, K. L., and Viergever, M. A. Multiscale vessel enhancement filtering. Medical Image Computing and Computer-Assisted Intervention (MICCAI 1998), Lecture Notes in Computer Science 1496, 130 to 137, 1998.
    doi: 10.1007/BFb0056195
  - kind: library
    text: scikit-image documentation, skimage.filters.frangi.
implementation: {path: engine/src/pixelnexus_engine/filters/ridges.py, symbol: frangi_filter}
tests: [engine/tests/test_ridges.py]
learn:
  oneSentence: Find the middle of lines from how the brightness bends across them.
  howItWorks:
    - Smooth the image at several scales.
    - At each pixel, measure how the brightness bends across and along each direction.
    - A line bends strongly across and hardly at all along.
    - Keep the strongest answer over the scales.
  academic: >-
    Multiscale vesselness from the eigenvalues of the Gaussian-derivative Hessian, after Frangi et al.
  paramNotes:
    ridges: Dark or bright lines.
    sigmaMin: The thinnest lines to find.
    sigmaMax: The widest lines to find.
    sigmaStep: How many widths are tried.
    beta: How strongly round blobs are removed.
    gamma: How strong a line must be.
    border: How the image is filled past its edges.
    channelScope: Which part of the color image is used.
  tryThis:
    - Open the Disks image with Dark ridges. The dark ring right outside each disk shows, and the disks themselves stay black.
  pitfalls:
    - The wrong ridge color. Dark ridges on a bright line image find the gaps between lines.
  demos: [line-profile]
related: [hessian, sato, meijering, matched-vessel, line-detector]
docsPage: filters/features/frangi.md
