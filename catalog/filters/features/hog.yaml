id: hog
name: Histogram of Oriented Gradients
aliases: [HOG]
family: features
tags: [purpose:analysis, purpose:edge]
tier: advanced
engine: science
phase: 6d
status: implemented-tested
planNotes: With visualization.

summary: Describes the shape in each small cell of the image by a histogram of its gradient directions, after Dalal and Triggs. The view draws each cell as a star of lines, one per direction, as bright as the gradients in that direction.
purpose: See how the HOG descriptor of object detectors, such as people detectors, sees an image.
classification: {linearity: nonlinear, domain: spatial, operation: gradient orientation histograms}
output: image
representation: algorithm
representationLabel: exact
representationSource: {path: engine/src/pixelnexus_engine/filters/texture.py, symbol: hog_representation}
supportRadius: global
supportsMask: true
preview: on-demand
colorHandling: >-
  The filter works on the 8-bit luma with the BT.709 weights and gives a gray view, stretched so
  its brightest line is white. Alpha is kept.
boundary: scikit-image sets the vertical difference to 0 on the top and bottom rows, and the horizontal difference to 0 on the left and right columns. Cells that do not fit at the right and bottom edges are left out.
dependencies:
  - {name: scikit-image, optional: false, note: 'skimage.feature.hog with visualize.'}

params:
  - key: orientations
    label: Orientation bins
    type: integer
    min: 2
    max: 36
    step: 1
    default: 9
    description: The number of bins between 0 and 180 degrees. Dalal and Triggs use 9.
    effect: More bins tell directions apart more finely.
  - key: cellSize
    label: Cell size
    type: integer
    min: 4
    max: 64
    step: 1
    default: 8
    unit: px
    description: The side of the square cells. Dalal and Triggs use 8.
    effect: Larger cells describe coarser shape.
  - key: blockSize
    label: Block size
    type: integer
    min: 1
    max: 8
    step: 1
    default: 3
    description: The side of the blocks of cells that are normalized together. scikit-image uses 3.
    effect: Blocks only change the descriptor, not the view.
  - key: blockNorm
    label: Block normalization
    type: select
    default: L2-Hys
    options:
      - {value: L1, label: L1}
      - {value: L1-sqrt, label: L1 then square root}
      - {value: L2, label: L2}
      - {value: L2-Hys, label: L2-Hys}
    description: How each block is normalized. L2-Hys is L2, then values are clipped at 0.2 and normalized again, as in the paper.
    effect: Changes the descriptor, not the view.
formula: |
  G_x = I(x + 1, y) - I(x - 1, y),
  \qquad
  \theta = \arctan \frac{G_y}{G_x} \bmod 180^\circ,
  \qquad
  h_c(b) = \sum_{x \in c,\ \theta(x) \in b} \lvert G(x) \rvert
formulaExplanation: >-
  The gradient comes from centered differences, with its magnitude and an unsigned direction
  from 0 to 180 degrees. Each cell gets a histogram of the directions of its pixels, weighted
  by the magnitude. Dalal and Triggs then normalize blocks of cells together, so the
  descriptor does not depend on the lighting, and chain all blocks into one long vector for a
  classifier. The view of scikit-image draws each cell histogram as lines through the cell
  center, one per bin, as bright as its weight. Each line lies across its gradient direction,
  so it runs along the edges in the cell. The view shows the cell histograms before the block
  normalization, so the block settings only change the descriptor.
symbols:
  - {symbol: 'G_x, G_y', meaning: 'The centered differences'}
  - {symbol: '\theta', meaning: 'The unsigned gradient direction'}
  - {symbol: 'h_c(b)', meaning: 'The weight of bin b in cell c'}
steps:
  - Take the 8-bit luma and its centered differences.
  - Build a weighted histogram of gradient directions in each cell.
  - Normalize blocks of cells for the descriptor.
  - Draw each cell histogram as a star of lines, and stretch the view.
complexity:
  time: O(N)
  memory: O(N)
  notes: N is the number of pixels.
useCases:
  - Seeing what a HOG-based detector of people or objects sees.
  - Teaching gradient histograms.
advantages:
  - Shows edge directions at a glance, cell by cell.
limitations:
  - The view does not show the block normalization.
  - Cells that do not fit at the right and bottom edges are not drawn.
artifacts:
  - Star shapes in noisy cells, where all directions are present.
references:
  - kind: paper
    text: Dalal, N., and Triggs, B. Histograms of oriented gradients for human detection. IEEE Conference on Computer Vision and Pattern Recognition, 886 to 893, 2005.
    doi: 10.1109/CVPR.2005.177
  - kind: library
    text: scikit-image documentation, skimage.feature.hog.
implementation: {path: engine/src/pixelnexus_engine/filters/texture.py, symbol: hog_filter}
tests: [engine/tests/test_texture.py]
learn:
  oneSentence: Summarize each small square of the image by the directions of its edges.
  howItWorks:
    - Find the direction and strength of the brightness change at every pixel.
    - Split the image into small cells.
    - In each cell, count the directions, weighted by strength.
    - Draw each count as a line along the edges in that direction.
  academic: >-
    Histograms of oriented gradients in cells with block normalization, after Dalal and Triggs,
    shown with the scikit-image visualization.
  paramNotes:
    orientations: How many directions are told apart.
    cellSize: How large the cells are.
    blockSize: How many cells are normalized together.
    blockNorm: How blocks are normalized.
  tryThis:
    - Apply it to the Siemens star. Every cell shows lines along the spokes that cross it.
  pitfalls:
    - Expecting the block settings to change the view. They only change the descriptor.
  demos: [line-profile]
related: [sobel, sift, laws]
docsPage: filters/features/hog.md
