id: meijering
name: Meijering filter
aliases: [Neuriteness, Meijering neuriteness]
family: features
tags: [purpose:analysis, purpose:segmentation]
tier: advanced
engine: science
phase: 6d
status: implemented-tested

summary: Finds thin, faint lines such as neurites with the neuriteness measure of Meijering et al. It mixes each Hessian eigenvalue with a third of the other, which favors long, flat lines.
purpose: Enhance neurites and other faint thin lines in microscope images before tracing them.
classification: {linearity: nonlinear, domain: spatial, operation: Hessian eigenvalue neuriteness}
output: image
representation: algorithm
representationLabel: exact
representationSource: {path: engine/src/pixelnexus_engine/filters/ridges.py, symbol: ridge_representation}
supportRadius: global
supportsMask: true
preview: on-demand
channelScopes: [luminance, rgb]
colorHandling: >-
  By default the filter works on luma, with the BT.709 weights, and gives a gray result. With
  the RGB scope, each channel is filtered on its own. In retinal photos the green channel often
  shows vessels best. Alpha is kept.
boundary: Set by the Border mode parameter. The default is reflect, as in scikit-image. It fills the Gaussian derivatives past the edge.
dependencies:
  - {name: scikit-image, optional: false, note: 'skimage.filters.meijering and the Hessian (skimage.feature.hessian_matrix).'}

params:
  - key: ridges
    label: Ridges
    type: select
    default: dark
    options:
      - {value: dark, label: Dark ridges}
      - {value: bright, label: Bright ridges}
    description: Whether the lines to find are darker or brighter than their surroundings. Vessels in retinal photos are dark.
    effect: The wrong choice finds the gaps between lines instead.
  - key: sigmaMin
    label: Smallest scale
    type: number
    min: 0.5
    max: 20
    step: 0.5
    default: 1
    unit: px
    description: The smallest Gaussian sigma. A line of width w responds most near sigma = w / 2 or a little less.
    effect: Smaller values find thinner lines, and also more noise.
  - key: sigmaMax
    label: Largest scale
    type: number
    min: 0.5
    max: 20
    step: 0.5
    default: 9
    unit: px
    description: The largest Gaussian sigma. If it is below the smallest scale, only the smallest is used.
    effect: Larger values also find wide lines, and take longer.
  - key: sigmaStep
    label: Scale step
    type: number
    min: 0.5
    max: 10
    step: 0.5
    default: 2
    unit: px
    description: The step between the scales. The defaults give 1, 3, 5, 7 and 9, the scikit-image defaults.
    effect: Smaller steps try more scales and take longer.
  - ref: border
    default: reflect
  - ref: channelScope
    default: luminance
formula: |
  \lambda' = \operatorname*{arg\,max}_{\mu \in \{\lambda_1 + \alpha\lambda_2,\ \lambda_2 + \alpha\lambda_1\}} \lvert\mu\rvert,
  \qquad
  N_\sigma = \frac{\max(\lambda', 0)}{\max_x \max(\lambda', 0)},
  \qquad
  \alpha = \tfrac{1}{3}
formulaExplanation: >-
  The Hessian is the matrix of second derivatives of the image smoothed by a Gaussian of sigma.
  Meijering's measure mixes each eigenvalue with a third of the other and keeps the one of the
  larger size. This changes the shape of the response across a line, so long, flat lines stand
  out. Negative values are set to 0, and each scale is divided by its largest value over the
  image, so every scale reaches 1. The filter keeps the largest value over the scales and
  stretches the result so the strongest response is white. scikit-image uses alpha = 1/3 by
  default.
symbols:
  - {symbol: '\lambda_1, \lambda_2', meaning: 'The Hessian eigenvalues'}
  - {symbol: '\alpha', meaning: 'The mixing constant, 1/3'}
  - {symbol: 'N_\sigma', meaning: 'The neuriteness at scale sigma, from 0 to 1'}
steps:
  - Compute the Hessian with Gaussian derivatives at each scale.
  - Mix each eigenvalue with a third of the other, and keep the larger in size.
  - Clip at 0 and divide by the largest value of that scale.
  - Keep the largest value over the scales and stretch it to the full range.
complexity:
  time: O(K N sigma)
  memory: O(N)
  notes: N is the number of pixels, K the number of scales and sigma the largest scale. The Gaussian derivatives are separable, and their windows reach 8 sigma.
useCases:
  - Neurites in fluorescence microscopy.
  - Faint thin lines such as hairs and scratches.
advantages:
  - Strong for faint, thin lines.
  - Every scale is normalized to the same range.
limitations:
  - Each scale is normalized by its own maximum, so a single strong feature changes the scale of the whole result.
  - Like Sato, it also responds to blobs.
artifacts:
  - Broad halos around strong lines at large scales.
references:
  - kind: paper
    text: Meijering, E., Jacob, M., Sarria, J.-C. F., Steiner, P., Hirling, H., and Unser, M. Design and validation of a tool for neurite tracing and analysis in fluorescence microscopy images. Cytometry Part A 58A(2), 167 to 176, 2004.
    doi: 10.1002/cyto.a.20022
  - kind: library
    text: scikit-image documentation, skimage.filters.meijering.
implementation: {path: engine/src/pixelnexus_engine/filters/ridges.py, symbol: meijering_filter}
tests: [engine/tests/test_ridges.py]
learn:
  oneSentence: Find faint thin lines from a mixed measure of how the brightness bends.
  howItWorks:
    - Smooth the image at several scales.
    - At each pixel, measure how the brightness bends across and along each direction.
    - A line bends strongly across and hardly at all along.
    - Keep the strongest answer over the scales.
  academic: >-
    Neuriteness from mixed Hessian eigenvalues with alpha = 1/3, normalized per scale, after Meijering et al.
  paramNotes:
    ridges: Dark or bright lines.
    sigmaMin: The thinnest lines to find.
    sigmaMax: The widest lines to find.
    sigmaStep: How many widths are tried.
    border: How the image is filled past its edges.
    channelScope: Which part of the color image is used.
  tryThis:
    - Set the smallest and largest scale both to 1 to find only the thinnest lines.
  pitfalls:
    - One very strong line. It sets the scale, and fainter lines come out dim.
  demos: [line-profile]
related: [frangi, hessian, sato]
docsPage: filters/features/meijering.md
