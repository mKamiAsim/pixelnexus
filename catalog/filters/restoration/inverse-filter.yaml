id: inverse-filter
name: Inverse filtering
aliases: [Inverse filter, Direct inverse filtering, Pseudo-inverse filter]
family: restoration
tags: [purpose:sharpening]
tier: core
engine: browser
phase: 5e
status: implemented-tested
planNotes: With a cutoff radius.

summary: Undoes a known blur by dividing the spectrum by the transform of the blur, only where the blur left enough of each frequency.
purpose: Show how a known blur can be undone exactly, and why noise makes this fail.
classification: {linearity: linear, domain: frequency, operation: division by the transfer function}
output: image
representation: algorithm
representationLabel: exact
representationSource: {path: web/src/core/filters/restoration/deconvolve.ts, symbol: inverseGain}
supportRadius: global
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  By default each of the red, green and blue channels is filtered on its own. With the
  brightness scope, only luma is filtered and the colors stay.
boundary: >-
  Set by the Border mode parameter. The default is reflect. The image is extended by half its
  size, at most 256 pixels, on each side, as for the frequency filters. The filter needs the
  whole spectrum, so it always runs on the whole image.

params:
  - key: psf
    label: Blur
    type: select
    default: gaussian
    options:
      - {value: gaussian, label: Gaussian}
      - {value: motion, label: Motion}
      - {value: defocus, label: Defocus}
    description: The point spread function, the picture a single bright point turns into.
    effect: Gaussian blur is soft, motion blur smears along a line, and defocus blur spreads into a disk.
  - key: sigma
    label: Sigma
    type: number
    min: 0.3
    max: 10
    step: 0.1
    default: 2
    unit: px
    description: The standard deviation of the Gaussian blur. The PSF ends at 4 sigma.
    effect: Larger values blur more.
  - key: length
    label: Motion length
    type: number
    min: 1
    max: 51
    step: 0.5
    default: 9
    unit: px
    description: The length of the straight motion, for motion blur.
    effect: Longer motion smears more.
  - key: angle
    label: Motion angle
    type: angle
    min: 0
    max: 180
    step: 1
    default: 0
    unit: deg
    description: The direction of the motion, counterclockwise from the x axis, as for motion blur.
    effect: Turns the direction of the smear.
  - key: radius
    label: Defocus radius
    type: number
    min: 0.5
    max: 15
    step: 0.1
    default: 3
    unit: px
    description: The radius of the defocus disk.
    effect: Larger disks blur more.
  - key: cutoff
    label: Cutoff
    type: number
    min: 0.01
    max: 0.71
    step: 0.01
    default: 0.71
    unit: cycles/px
    description: Frequencies farther than this from the center of the spectrum are set to 0. The default 0.71 keeps all of them.
    effect: Lower values keep the result smoother, as with a low-pass filter.
  - key: threshold
    label: Smallest gain
    type: number
    min: 0.001
    max: 0.5
    step: 0.001
    default: 0.05
    description: Frequencies where the blur kept less than this share, |H| below it, are set to 0 instead of divided.
    effect: Lower values undo more of the blur and also raise more noise.
  - ref: border
    default: reflect
  - ref: channelScope
    default: rgb
formula: |
  \hat{F}(f) = \begin{cases} G(f) / H(f) & |f| \le D_0,\ |H(f)| \ge \epsilon \\ 0 & \text{otherwise} \end{cases},\quad D_0 = {{cutoff}},\ \epsilon = {{threshold}}
formulaExplanation: >-
  A blur multiplies the spectrum F of the image by H, the transform of the PSF h, so G = H F.
  Dividing by H gives F back. Where |H| is very small, the blur removed the frequency and any
  noise is divided by almost 0. The filter therefore divides only where |H| reaches the threshold
  and within the cutoff radius, as Gonzalez and Woods limit the inverse filter to a radius. H is
  the FFT of h placed with its center at the origin of the grid. The PSF is the kernel of the Gaussian filter cut at 4 sigma, of the motion blur filter, or of the disk averaging filter.
symbols:
  - {symbol: 'G, H, F', meaning: 'The spectra of the blurred image, the PSF and the estimate'}
  - {symbol: 'D_0', meaning: The cutoff radius in cycles per pixel}
  - {symbol: '\epsilon', meaning: The smallest gain that is divided}
steps:
  - Extend the image with the border mode by half its size, at most 256 pixels, on each side.
  - Take the 2D FFT of the image and of the PSF placed at the grid origin.
  - Divide by H where |H| reaches the threshold within the cutoff, and set the rest to 0.
  - Take the inverse FFT, keep the real part and crop the extension.
complexity:
  time: O(N log N)
  memory: O(N)
  notes: N is the number of pixels of the extended image.
useCases:
  - Teaching deconvolution and the effect of noise on it.
  - Undoing a known blur of an image with almost no noise.
advantages:
  - Exact where the blur is known and no noise is present.
limitations:
  - Noise at frequencies where |H| is small is raised hugely.
  - Needs the exact blur. A wrong PSF gives ringing and false detail.
artifacts:
  - Ringing near edges and the image border.
  - Strong noise when the threshold is low.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 5, image restoration and reconstruction.
implementation: {path: web/src/core/filters/restoration/deconvolve.ts, symbol: inverseFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: Undo a blur by dividing by it in the frequency domain, but only where enough of the image is left.
  howItWorks:
    - A blur weakens each frequency of the image by a known factor H.
    - Divide each frequency by that factor to get it back.
    - Where the factor is almost 0, give up and set the frequency to 0.
  academic: >-
    Pseudo-inverse filtering, radially limited as in Gonzalez and Woods, with a threshold on
    the transfer function.
  paramNotes:
    psf: The shape of the known blur.
    sigma: The size of the Gaussian blur.
    length: The length of the motion.
    angle: The direction of the motion.
    radius: The size of the defocus disk.
    cutoff: How far from the center frequencies are restored.
    threshold: How weak a frequency may be and still be restored.
  tryThis:
    - In the Noise lab, choose the blur damage and lower the smallest gain step by step.
  pitfalls:
    - A tiny smallest gain on a noisy image. The noise grows until it hides the image.
  demos: [noise-lab]
related: [wiener-deconv, degrade-blur, richardson-lucy]
docsPage: filters/restoration/inverse-filter.md
