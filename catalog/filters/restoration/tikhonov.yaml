id: tikhonov
name: Tikhonov regularization
aliases: [Tikhonov deconvolution, Regularized deconvolution, Ridge deconvolution]
family: restoration
tags: [purpose:sharpening, purpose:denoise]
tier: core
engine: browser
phase: 5e
status: implemented-tested

summary: Undoes a known blur while keeping the result smooth, by adding a penalty on its size or its gradient.
purpose: Deblur with control over how smooth the result stays, as the simplest regularized restoration.
classification: {linearity: linear, domain: frequency, operation: regularized deconvolution}
output: image
representation: algorithm
representationLabel: exact
representationSource: {path: web/src/core/filters/restoration/deconvolve.ts, symbol: regularizedGain}
supportRadius: global
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  By default each of the red, green and blue channels is filtered on its own. With the
  brightness scope, only luma is filtered and the colors stay.
boundary: >-
  Set by the Border mode parameter. The default is reflect. The image is extended by half its
  size, at most 256 pixels, on each side, as for the frequency filters. The filter needs the
  whole spectrum, so it always runs on the whole image.

params:
  - key: psf
    label: Blur
    type: select
    default: gaussian
    options:
      - {value: gaussian, label: Gaussian}
      - {value: motion, label: Motion}
      - {value: defocus, label: Defocus}
    description: The point spread function, the picture a single bright point turns into.
    effect: Gaussian blur is soft, motion blur smears along a line, and defocus blur spreads into a disk.
  - key: sigma
    label: Sigma
    type: number
    min: 0.3
    max: 10
    step: 0.1
    default: 2
    unit: px
    description: The standard deviation of the Gaussian blur. The PSF ends at 4 sigma.
    effect: Larger values blur more.
  - key: length
    label: Motion length
    type: number
    min: 1
    max: 51
    step: 0.5
    default: 9
    unit: px
    description: The length of the straight motion, for motion blur.
    effect: Longer motion smears more.
  - key: angle
    label: Motion angle
    type: angle
    min: 0
    max: 180
    step: 1
    default: 0
    unit: deg
    description: The direction of the motion, counterclockwise from the x axis, as for motion blur.
    effect: Turns the direction of the smear.
  - key: radius
    label: Defocus radius
    type: number
    min: 0.5
    max: 15
    step: 0.1
    default: 3
    unit: px
    description: The radius of the defocus disk.
    effect: Larger disks blur more.
  - key: lambda
    label: Lambda
    type: number
    min: 0.0001
    max: 1
    step: 0.0001
    default: 0.01
    description: The weight lambda of the penalty.
    effect: Higher values give a smoother result with less noise and less restored detail.
  - key: operator
    label: Penalty
    type: select
    default: gradient
    options:
      - {value: gradient, label: Gradient}
      - {value: laplacian, label: Laplacian}
      - {value: identity, label: Size of the values}
    description: What the penalty measures. The gradient and the Laplacian penalize rough results, the identity large values.
    effect: Gradient and Laplacian keep flat areas flat. The identity acts like Wiener deconvolution with a constant K.
  - ref: border
    default: reflect
  - ref: channelScope
    default: rgb
formula: |
  \hat{F}(f) = \frac{\overline{H(f)}}{|H(f)|^2 + \lambda |L(f)|^2}\, G(f),\quad \lambda = {{lambda}}
formulaExplanation: >-
  The estimate minimizes |h * f - g|^2 + lambda |L f|^2, the error of the blurred estimate
  plus a penalty. For a convolution the minimizer has this closed form in the frequency domain.
  L is one of three operators. The identity has |L|^2 = 1. The forward-difference gradient has
  |L|^2 = 4 sin^2(pi f_x) + 4 sin^2(pi f_y). The third is the 4-neighbor Laplacian kernel of
  Gonzalez and Woods. With the identity
  the filter equals Wiener deconvolution with K = lambda. H is the FFT of the PSF placed with its
  center at the origin of the grid. The PSF is the kernel of the Gaussian filter cut at 4 sigma, of the motion blur filter, or of the disk averaging filter.
symbols:
  - {symbol: 'G, H, F', meaning: 'The spectra of the blurred image, the PSF and the estimate'}
  - {symbol: 'L', meaning: The transform of the penalty operator}
  - {symbol: '\lambda', meaning: The weight of the penalty}
steps:
  - Extend the image with the border mode by half its size, at most 256 pixels, on each side.
  - Take the 2D FFT of the image and of the PSF placed at the grid origin.
  - Multiply each frequency by conj(H) / (|H|^2 + lambda |L|^2).
  - Take the inverse FFT, keep the real part and crop the extension.
complexity:
  time: O(N log N)
  memory: O(N)
  notes: N is the number of pixels of the extended image.
useCases:
  - Deblurring with a known PSF when the noise level is not known well.
  - Teaching regularization of ill-posed problems.
advantages:
  - A closed form, so it runs in one pass.
  - The gradient penalty keeps flat areas flat while restoring edges.
limitations:
  - Lambda must be chosen by hand. Constrained least squares chooses it from the noise level.
  - Needs the blur. A wrong PSF gives ringing.
artifacts:
  - Ringing near strong edges and the image border.
references:
  - kind: book
    text: Tikhonov, A. N. and Arsenin, V. Y. Solutions of Ill-Posed Problems. Winston, 1977.
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 5, image restoration and reconstruction.
implementation: {path: web/src/core/filters/restoration/deconvolve.ts, symbol: tikhonovFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts]
learn:
  oneSentence: Undo a blur, but prefer smooth results, so noise is not blown up.
  howItWorks:
    - Look for the image that, blurred, matches the input best.
    - Add a penalty for roughness, weighted by lambda.
    - In the frequency domain this has an exact answer, one division per frequency.
  academic: >-
    Tikhonov-regularized least-squares deconvolution with an identity, gradient or Laplacian
    penalty, solved in closed form for a circulant blur.
  paramNotes:
    psf: The shape of the known blur.
    sigma: The size of the Gaussian blur.
    length: The length of the motion.
    angle: The direction of the motion.
    radius: The size of the defocus disk.
    lambda: How strongly roughness is penalized.
    operator: What counts as rough.
  tryThis:
    - In the Noise lab, choose the blur damage and raise lambda until the noise is gone.
  pitfalls:
    - A very small lambda on a noisy image. The result is as noisy as the inverse filter.
  demos: [noise-lab]
related: [cls, wiener-deconv, inverse-filter]
docsPage: filters/restoration/tikhonov.md
