id: log-gabor
name: Log-Gabor filter
aliases: [Log Gabor filter, Log-Gabor wavelet]
family: frequency
alsoIn: [features]
tags: [purpose:texture, purpose:edge]
tier: core
engine: browser
phase: 5e
status: implemented-tested

summary: A band-pass filter that is a Gaussian on a log frequency scale, so it has no response at frequency 0 and a long tail toward fine detail.
purpose: Find texture, stripes, lines and edges at one scale and direction, with the frequency shape that matches natural images.
classification: {linearity: linear, domain: frequency, operation: frequency response}
output: image
representation: frequency-response
representationLabel: exact
representationSource: {path: web/src/core/filters/frequency/shaping.ts, symbol: logGaborResponse}
supportRadius: global
supportsMask: true
preview: live
channelScopes: [luminance, rgb]
colorHandling: >-
  By default the filter works on luma and gives a gray result. With RGB scope, each channel is filtered on its own.
boundary: >-
  Set by the Border mode parameter. The default is reflect. The image is extended by half its
  size, at most 256 pixels, on each side, so the circular wrap of the FFT does not mix opposite
  edges. The filter needs the whole spectrum, so it always runs on the whole image.

params:
  - key: wavelength
    label: Wavelength
    type: number
    min: 3
    max: 64
    step: 0.5
    default: 8
    unit: px
    description: The wavelength 1 / f_0 at the center of the pass band, in pixels.
    effect: The filter responds most to stripes and edges of about this spacing.
  - key: sigmaOnf
    label: Bandwidth ratio
    type: number
    min: 0.3
    max: 0.9
    step: 0.05
    default: 0.55
    description: The ratio sigma / f_0 of the log-Gaussian. 0.55 gives about 2 octaves, 0.75 about 1 octave.
    effect: Smaller values give a wider band of frequencies.
  - key: oriented
    label: One direction
    type: boolean
    default: true
    description: With this on, the filter keeps one direction of the spectrum. With it off, it keeps all directions.
    effect: One direction gives a complex result with line and edge parts.
  - key: angle
    label: Angle
    type: angle
    min: 0
    max: 360
    step: 1
    default: 0
    unit: deg
    description: The direction in which the wave changes, counterclockwise on screen. 0 finds vertical stripes.
    effect: The filter responds to stripes and edges that run across this direction.
  - key: angularSigma
    label: Angular spread
    type: number
    min: 5
    max: 90
    step: 1
    default: 25
    unit: deg
    description: The standard deviation sigma_theta of the angular Gaussian.
    effect: Smaller values make the filter more selective about direction.
  - key: output
    label: Output
    type: select
    default: magnitude
    options:
      - {value: magnitude, label: Magnitude}
      - {value: real, label: Real part (lines)}
      - {value: imaginary, label: Imaginary part (edges)}
    description: Which part of the complex result to show, when the filter has one direction.
    effect: The real part finds lines, the imaginary part finds edges, and the magnitude finds both.
  - ref: outputMapping
    default: normalize
  - ref: border
    default: reflect
  - ref: channelScope
    default: luminance
formula: |
  H = e^{-\frac{(\ln(f / f_0))^2}{2 (\ln(\sigma / f_0))^2}}\, e^{-\Delta\theta^2 / 2 \sigma_\theta^2},\quad f_0 = 1 / {{wavelength}},\ \sigma / f_0 = {{sigmaOnf}}
formulaExplanation: >-
  The radial part is Field's log-Gabor function, a Gaussian of ln(f / f_0). It is 0 at
  frequency 0 and falls off slowly toward high frequencies. The angular part is Kovesi's Gaussian
  of the angle Delta theta between a frequency and the filter direction. Here f is the distance
  from the center of the spectrum in cycles per pixel. The y axis points down, so the
  direction of a frequency is atan2(-f_y, f_x). With one direction the filter covers one side
  of the spectrum, so the result is complex. Without a direction the angular part is left out
  and the result is real.
symbols:
  - {symbol: 'f', meaning: The distance from the center of the spectrum in cycles per pixel}
  - {symbol: 'f_0', meaning: The center frequency}
  - {symbol: '\sigma / f_0', meaning: The bandwidth ratio}
  - {symbol: '\Delta\theta', meaning: The angle between a frequency and the filter direction}
  - {symbol: '\sigma_\theta', meaning: The angular spread}
steps:
  - Extend the image with the border mode by half its size, at most 256 pixels, on each side.
  - Take the 2D FFT and multiply each frequency by H.
  - Take the inverse FFT.
  - Return the real part, the imaginary part or the magnitude, and crop the extension.
complexity:
  time: O(N log N)
  memory: O(N)
  notes: N is the number of pixels of the extended image, about 4 times the image for images up to 512 pixels on a side.
useCases:
  - Texture analysis and feature detection at one scale and direction.
  - The filters of phase congruency.
advantages:
  - No response at frequency 0, so flat areas give 0, unlike the real part of a Gabor filter.
  - Wide bandwidths are possible, with a long tail toward fine detail like natural images.
limitations:
  - It has no closed form in space, so it runs in the frequency domain.
  - One filter sees one scale and one direction.
artifacts:
  - Ringing next to strong edges, from the band shape.
references:
  - kind: paper
    text: Field, D. J. Relations between the statistics of natural images and the response properties of cortical cells. Journal of the Optical Society of America A 4(12), 2379 to 2394, 1987.
    doi: 10.1364/JOSAA.4.002379
  - kind: paper
    text: Kovesi, P. Phase congruency, a low-level image invariant. Psychological Research 64(2), 136 to 148, 2000.
    doi: 10.1007/s004260000024
implementation: {path: web/src/core/filters/frequency/shaping.ts, symbol: logGaborFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts, web/src/core/filters/frequency/frequency.test.ts]
learn:
  oneSentence: A Gabor filter shaped on a log frequency scale, so it ignores flat areas and fits natural images.
  howItWorks:
    - Keep a band of frequencies around the chosen wavelength, wider on the fine side.
    - With one direction, keep only the frequencies near that direction.
    - Transform back. Lines show in the real part and edges in the imaginary part.
  academic: >-
    A log-Gabor filter with Field's radial transfer function and Kovesi's angular Gaussian.
    Its log-scale Gaussian matches the 1/f amplitude spectrum of natural images.
  paramNotes:
    wavelength: The stripe spacing it looks for.
    sigmaOnf: How narrow the band of frequencies is.
    oriented: Whether it looks in one direction.
    angle: The direction it looks in.
    angularSigma: How narrow the range of directions is.
    output: Lines, edges or both.
  tryThis:
    - Open the Siemens star and compare the Gabor and log-Gabor results at the same wavelength.
  pitfalls:
    - Expecting the output option to matter without one direction. The result is then real.
  demos: [frequency-explorer]
related: [gabor, gabor-bank, phase-congruency]
docsPage: filters/frequency/log-gabor.md
