id: butterworth-bandreject
name: Butterworth band-reject
aliases: [Butterworth band-stop filter, Butterworth band stop filter]
family: frequency
tags: [purpose:denoise]
tier: core
engine: browser
phase: 5e
status: implemented-tested

summary: Removes a ring of frequencies and keeps the rest, which suppresses noise or patterns of one size. The cutoff is smooth, and the order sets how sharp it is.
purpose: Remove noise or a pattern whose detail has one size, and keep the rest of the image.
classification: {linearity: linear, domain: frequency, operation: frequency response}
output: image
representation: frequency-response
representationLabel: exact
representationSource: {path: web/src/core/filters/frequency/passband.ts, symbol: passResponse}
supportRadius: global
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  By default each of the red, green and blue channels is filtered on its own. With the brightness scope, only luma is filtered and the colors stay.
boundary: >-
  Set by the Border mode parameter. The default is reflect. The image is extended by half its
  size, at most 256 pixels, on each side, so the circular wrap of the FFT does not mix opposite
  edges. The filter needs the whole spectrum, so it always runs on the whole image.

params:
  - key: center
    label: Band center
    type: number
    min: 0.01
    max: 0.5
    step: 0.005
    default: 0.2
    unit: cycles/px
    description: The frequency D_0 in the middle of the band, in cycles per pixel.
    effect: Higher values move the band to finer detail.
  - key: width
    label: Band width
    type: number
    min: 0.005
    max: 0.5
    step: 0.005
    default: 0.1
    unit: cycles/px
    description: The width W of the band, in cycles per pixel.
    effect: Wider bands remove detail of more sizes.
  - key: order
    label: Order
    type: integer
    min: 1
    max: 10
    step: 1
    default: 2
    description: The order n of the Butterworth filter.
    effect: Higher orders make the change from pass to stop sharper, closer to the ideal filter, with more ringing.
  - ref: border
    default: reflect
  - ref: channelScope
    default: rgb
formula: |
  H = \frac{1}{1 + \left( \frac{D W}{D^2 - D_0^2} \right)^{2n}},\quad D = \sqrt{f_x^2 + f_y^2},\ D_0 = {{center}},\ W = {{width}},\ n = {{order}}
formulaExplanation: >-
  D is the distance of a frequency from the center of the spectrum, in cycles per pixel, so the filter does the same thing on any image size. Gonzalez and Woods measure D in samples of the padded spectrum. Divide their value by the padded size to get the one here. At D = D_0 the response is 0. Ringing near edges comes from the impulse response of H, which is wider the sharper the cutoff.
symbols:
  - {symbol: 'D', meaning: The distance from the center of the spectrum in cycles per pixel}
  - {symbol: 'f_x, f_y', meaning: The frequency along x and y in cycles per pixel}
  - {symbol: 'D_0', meaning: The center of the band}
  - {symbol: 'W', meaning: The width of the band}
  - {symbol: 'n', meaning: The order}
steps:
  - Extend the image with the border mode by half its size, at most 256 pixels, on each side.
  - Take the 2D FFT.
  - Multiply each frequency by H.
  - Take the inverse FFT and keep the real part.
  - Crop the extension.
complexity:
  time: O(N log N)
  memory: O(N)
  notes: N is the number of pixels of the extended image, about 4 times the image for images up to 512 pixels on a side.
useCases:
  - Removing periodic noise that lies on a ring of the spectrum.
  - Suppressing a pattern of one scale.
advantages:
  - The order trades sharpness against ringing. Order 1 does not ring, and order 2 rings very little.
limitations:
  - High orders ring almost as much as the ideal filter.
  - A ring removes all directions. Use notch filters for patterns in one direction.
artifacts:
  - Ringing next to strong edges at high orders.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 4, filtering in the frequency domain.
implementation: {path: web/src/core/filters/frequency/passband.ts, symbol: butterworthBandrejectFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts, web/src/core/filters/frequency/frequency.test.ts]
learn:
  oneSentence: Remove the detail of one size, such as a regular pattern, and keep the rest.
  howItWorks:
    - Split the image into waves of many frequencies with the FFT.
    - Drop the waves in a ring around the center of the spectrum.
    - Add the rest back together.
  academic: >-
    The Butterworth band-reject transfer function of order n, as given by Gonzalez and Woods.
  paramNotes:
    center: Which size of detail the band holds.
    width: How many sizes the band holds.
    order: How sharp the switch is.
  tryThis:
    - Add periodic noise, then place the band on its frequency in the Frequency explorer.
  pitfalls:
    - Very high orders. They ring like the ideal filter.
  demos: [frequency-explorer]
related: [ideal-bandreject, gaussian-bandreject, butterworth-bandpass, notch-reject]
docsPage: filters/frequency/butterworth-bandreject.md
