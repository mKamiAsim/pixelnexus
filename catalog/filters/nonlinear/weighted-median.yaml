id: weighted-median
name: Weighted median filter
aliases: [Center-weighted median filter]
family: nonlinear
tags: [purpose:denoise, noise:impulse]
tier: core
engine: browser
phase: 5b
status: implemented-tested

summary: A median in which each window position counts as many times as its weight.
purpose: Remove impulse noise while keeping more fine detail than a plain median.
classification: {linearity: nonlinear, domain: spatial, operation: weighted order statistic}
output: image
representation: rank
representationLabel: exact
representationSource: {path: web/src/core/filters/nonlinear/weighted-median.ts, symbol: medianWeights}
supportRadius: half the larger side of the weights
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  Red, green and blue are filtered separately with the same weights. With the brightness
  scope, luma is rounded to whole values first. Alpha is kept.
boundary: Set by the Border mode parameter. The default is reflect 101.

params:
  - key: weights
    label: Weights
    type: kernel
    default: 1 1 1; 1 3 1; 1 1 1
    description: The weight of each window position, row by row, like a kernel. Both sides must be odd, up to 15. Weights must be 0 or more, with a total above 0.
    effect: A larger center weight keeps more detail and removes less noise. A weight of 0 leaves a position out.
  - ref: border
  - ref: channelScope

formula: |
  I_{\text{out}}(x,y) = \min\,\Bigl\{\, v \;:\; \sum_{(i,j)\,:\,I(x+i,\,y+j) \le v} w_{ij} \;\ge\; \tfrac{1}{2} \sum_{(i,j)} w_{ij} \,\Bigr\}
formulaExplanation: >-
  Sort the window values and add up their weights from the smallest value up. The output is
  the first value at which the running weight reaches half of the total. For whole weights
  with an odd total, this is the median of the list in which each value is repeated as often
  as its weight. For an even total it is the lower of the two middle values.
symbols:
  - {symbol: 'w_{ij}', meaning: 'Weight of window position (i, j)'}
  - {symbol: 'v', meaning: A candidate output value}
steps:
  - Read the weights. Fall back to the default if they are negative or add up to 0.
  - Pad the image with the border mode.
  - For each pixel, add each weight to the histogram bin of the value under it.
  - Walk the bins from 0 up until the running weight reaches half of the total, and write that value.
complexity:
  time: O(N\,(m + 256))
  memory: O(N)
  notes: N is the number of pixels per channel and m is the number of positions with a weight above 0.
useCases:
  - Remove salt-and-pepper noise from images with thin lines or text.
  - Use weights of 0 in the four corners of a 3x3 pattern for a plus-shaped median.
advantages:
  - A heavier center keeps corners and thin lines that a plain median removes.
  - The weights also set the window shape, since a weight of 0 leaves a position out.
limitations:
  - A center weight of half the total or more makes the filter return the input unchanged.
  - Weights must be 0 or more. Negative weights have no meaning here.
artifacts:
  - With a heavy center, noise clusters of two or three pixels can survive.
references:
  - kind: paper
    text: Brownrigg, D. R. K. The weighted median filter. Communications of the ACM 27(8), 807 to 818, 1984.
    doi: 10.1145/358198.358222
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Chapter 5.
implementation: {path: web/src/core/filters/nonlinear/weighted-median.ts, symbol: weightedMedianFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts, web/src/core/filters/nonlinear/nonlinear5b.test.ts]
learn:
  oneSentence: A median in which some neighbors get more votes than others.
  howItWorks:
    - Take the window around the pixel.
    - Count each value as often as the weight of its position.
    - Sort this longer list and take its middle value.
  academic: >-
    The weighted median minimizes the weighted sum of absolute differences to the window
    values. Integer weights are the same as repeating values. With a center weight of 1 and all
    other weights 1, it is the plain median.
  paramNotes:
    weights: One weight per window position, row by row, like a kernel. The center is the pixel being computed.
  tryThis:
    - Add salt-and-pepper noise to an image with text. Compare center weights 1, 3 and 5.
    - Set the four corner weights to 0 for a plus-shaped median.
  pitfalls:
    - Giving the center half of the total weight or more. Then nothing changes.
  demos: [rank-stepper, line-profile]
related: [median, adaptive-median, switching-median, rank-order]
docsPage: filters/nonlinear/weighted-median.md
