id: geometric-mean
name: Geometric mean filter
family: nonlinear
tags: [purpose:denoise, noise:gaussian]
tier: core
engine: browser
phase: 5b
status: implemented-tested

summary: Replaces each pixel with the geometric mean of its window, the root of the product of the values.
purpose: Smooth Gaussian noise with a little less loss of detail than the plain mean.
classification: {linearity: nonlinear, domain: spatial, operation: mean filter}
output: image
representation: estimator
representationLabel: exact
representationSource: {path: web/src/core/filters/nonlinear/means.ts, symbol: geometricMeanFilter}
supportRadius: floor(size / 2)
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  Red, green and blue are filtered separately. With the brightness scope, only luma changes.
  Alpha is kept.
boundary: Set by the Border mode parameter. The default is reflect 101. The constant mode reads 0 outside the image, which makes the border pixels 0.

params:
  - key: size
    label: Window size
    type: integer
    min: 3
    max: 15
    step: 2
    oddOnly: true
    default: 3
    unit: px
    description: Width and height of the square window.
    effect: Larger windows smooth more.
  - ref: border
  - ref: channelScope

formula: |
  I_{\text{out}}(x,y) = \Bigl(\prod_{(s,t) \in S_{xy}} I(s,t)\Bigr)^{1/n}
  = \exp\Bigl(\frac{1}{n} \sum_{(s,t) \in S_{xy}} \ln I(s,t)\Bigr)
formulaExplanation: >-
  The product of the n window values, to the power 1 / n. It runs as the exponential of the
  mean of the logarithms, which does not overflow. If any value in the window is 0, the
  product is 0, so the output is 0.
symbols:
  - {symbol: 'S_{xy}', meaning: 'The window around pixel (x, y)'}
  - {symbol: 'n', meaning: Number of values in the window}
steps:
  - Pad the image with the border mode.
  - Take the natural logarithm of every value above 0, and mark the zeros.
  - Sum the logarithms and the zero marks over each window with running sums.
  - Write 0 where a window holds a 0, and the exponential of the mean logarithm elsewhere.
complexity:
  time: O(N)
  memory: O(N)
  notes: N is the number of pixels per channel. Running sums make the cost per pixel independent of the window size.
useCases:
  - Smooth Gaussian noise while keeping slightly more detail than the box filter.
  - Average values that multiply, such as ratios.
advantages:
  - Gives about the same smoothing as the arithmetic mean, with a little less loss of detail.
  - Fast, with a cost that does not grow with the window.
limitations:
  - A single 0 makes the whole window 0, so pepper noise grows into black squares.
  - Always gives a value at or below the arithmetic mean, so it darkens slightly.
artifacts:
  - Black squares around black pixels.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Section 5.3, geometric mean filter.
  - kind: library
    text: SciPy documentation, scipy.stats.gmean.
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.gmean.html
implementation: {path: web/src/core/filters/nonlinear/means.ts, symbol: geometricMeanFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts, web/src/core/filters/nonlinear/nonlinear5b.test.ts]
learn:
  oneSentence: Multiply the neighbors together and take the root, instead of adding and dividing.
  howItWorks:
    - Take the window around the pixel.
    - Multiply its n values together.
    - Take the n-th root of the product.
  academic: >-
    The geometric mean is the arithmetic mean in the log domain. By the inequality of
    arithmetic and geometric means, it is never larger than the arithmetic mean, and equal only
    when all window values are the same.
  paramNotes:
    size: Width of the square window.
  tryThis:
    - Add Gaussian noise and compare with the box filter of the same size.
    - Add pepper noise and watch the black squares appear.
  pitfalls:
    - Using it on pepper noise. Each black pixel turns its whole window black.
  demos: [rank-stepper, line-profile]
related: [box, harmonic-mean, contraharmonic-mean]
docsPage: filters/nonlinear/geometric-mean.md
