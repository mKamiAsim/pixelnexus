id: harmonic-mean
name: Harmonic mean filter
family: nonlinear
tags: [purpose:denoise, noise:impulse, noise:gaussian]
tier: core
engine: browser
phase: 5b
status: implemented-tested

summary: Replaces each pixel with the harmonic mean of its window, n divided by the sum of the inverses.
purpose: Remove salt noise and smooth Gaussian noise.
classification: {linearity: nonlinear, domain: spatial, operation: mean filter}
output: image
representation: estimator
representationLabel: exact
representationSource: {path: web/src/core/filters/nonlinear/means.ts, symbol: harmonicMeanFilter}
supportRadius: floor(size / 2)
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  Red, green and blue are filtered separately. With the brightness scope, only luma changes.
  Alpha is kept.
boundary: Set by the Border mode parameter. The default is reflect 101. The constant mode reads 0 outside the image, which makes the border pixels 0.

params:
  - key: size
    label: Window size
    type: integer
    min: 3
    max: 15
    step: 2
    oddOnly: true
    default: 3
    unit: px
    description: Width and height of the square window.
    effect: Larger windows smooth more.
  - ref: border
  - ref: channelScope

formula: |
  I_{\text{out}}(x,y) = \frac{n}{\displaystyle\sum_{(s,t) \in S_{xy}} \frac{1}{I(s,t)}}
formulaExplanation: >-
  n divided by the sum of the inverses of the window values. Small values have large inverses,
  so they dominate, and a bright speck has little effect. If any value is 0, its inverse is
  infinite and the output is 0.
symbols:
  - {symbol: 'S_{xy}', meaning: 'The window around pixel (x, y)'}
  - {symbol: 'n', meaning: Number of values in the window}
steps:
  - Pad the image with the border mode.
  - Take 1 / v for every value v above 0, and mark the zeros.
  - Sum the inverses and the zero marks over each window with running sums.
  - Write 0 where a window holds a 0, and n divided by the sum of inverses elsewhere.
complexity:
  time: O(N)
  memory: O(N)
  notes: N is the number of pixels per channel. Running sums make the cost per pixel independent of the window size.
useCases:
  - Remove salt noise, the white specks.
  - Smooth Gaussian noise.
advantages:
  - Works well on salt noise.
  - Fast, with a cost that does not grow with the window.
limitations:
  - Fails on pepper noise. A single 0 makes the window 0.
  - Never larger than the geometric mean, so it darkens more than the box filter.
artifacts:
  - Black squares around black pixels. Bright thin lines get thinner.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Section 5.3, harmonic mean filter.
  - kind: library
    text: SciPy documentation, scipy.stats.hmean.
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.hmean.html
implementation: {path: web/src/core/filters/nonlinear/means.ts, symbol: harmonicMeanFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts, web/src/core/filters/nonlinear/nonlinear5b.test.ts]
learn:
  oneSentence: Average the inverses of the neighbors and invert back, so dark values count more.
  howItWorks:
    - Take the window around the pixel.
    - Add up 1 divided by each value.
    - Divide the number of values by that sum.
  academic: >-
    The harmonic mean is the contraharmonic mean with Q = -1. Small values have large inverses,
    so the result leans toward the dark values. That is why it removes salt noise but not pepper
    noise.
  paramNotes:
    size: Width of the square window.
  tryThis:
    - Add salt noise only and apply the harmonic mean. Then try pepper noise.
  pitfalls:
    - Using it on pepper noise. Each black pixel turns its window black.
  demos: [rank-stepper, line-profile]
related: [geometric-mean, contraharmonic-mean, box]
docsPage: filters/nonlinear/harmonic-mean.md
