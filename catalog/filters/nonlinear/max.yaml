id: max
name: Max filter
aliases: [Maximum filter, Local maximum]
family: nonlinear
tags: [purpose:denoise, noise:impulse]
tier: core
engine: browser
phase: 5b
status: implemented-tested
planNotes: Same result as gray dilation with a flat square. Shares code.

summary: Replaces each pixel with the largest value of its window.
purpose: Remove dark specks (pepper noise) and grow bright areas.
classification: {linearity: nonlinear, domain: spatial, operation: order statistic}
output: image
representation: rank
representationLabel: exact
representationSource: {path: web/src/core/filters/nonlinear/min-max.ts, symbol: extremeRank}
supportRadius: floor(size / 2)
supportsMask: true
preview: live
channelScopes: [rgb, luminance]
colorHandling: >-
  Red, green and blue each get their own maximum, so the three can come from different pixels.
  With the brightness scope, only luma changes and the colors stay. Alpha is kept.
boundary: Set by the Border mode parameter. The default is reflect 101.

params:
  - key: size
    label: Window size
    type: integer
    min: 3
    max: 25
    step: 2
    oddOnly: true
    default: 3
    unit: px
    description: Width and height of the square window.
    effect: Larger windows remove bigger dark specks and grow bright areas further.
  - ref: border
  - ref: channelScope

formula: |
  I_{\text{out}}(x,y) = \max\,\{\, I(x+i,\, y+j) \;:\; -r \le i \le r,\; -r \le j \le r \,\},
  \qquad
  r = ({{size}} - 1) / 2
formulaExplanation: >-
  The output is the largest value in the window. It is the last value of the sorted window, so
  it is the rank-order filter with the highest rank. It is also gray dilation with a flat
  square structuring element.
symbols:
  - {symbol: 'I', meaning: Input channel value}
  - {symbol: 'I_{\text{out}}', meaning: Output channel value}
  - {symbol: '(x, y)', meaning: Pixel position}
  - {symbol: 'r', meaning: Window radius in pixels}
steps:
  - Pad the image with the border mode.
  - For each row, find the largest value in each run of size pixels.
  - For each column of that result, find the largest value in each run of size pixels.
  - Write it to the output pixel.
complexity:
  time: O(N\,k)
  memory: O(N)
  notes: >-
    N is the number of pixels per channel and k is the window width. A row pass and a column
    pass of k values each give the maximum of all k^2 values.
useCases:
  - Remove pepper noise, the black specks.
  - Grow bright lines, stars and bright text.
  - Fill small dark gaps in bright areas.
advantages:
  - Simple and exact. Values are never invented.
  - Removes dark specks completely.
limitations:
  - Makes salt noise worse. Bright specks grow into squares.
  - Shrinks dark objects and thin dark lines.
artifacts:
  - Square bright blocks around bright pixels with large windows.
references:
  - kind: book
    text: Gonzalez, R. C. and Woods, R. E. Digital Image Processing, 4th edition. Pearson, 2018. Section 5.3, order-statistic filters.
  - kind: library
    text: SciPy documentation, scipy.ndimage.maximum_filter.
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.maximum_filter.html
implementation: {path: web/src/core/filters/nonlinear/min-max.ts, symbol: maxFilter}
tests: [web/src/core/filters/filters.test.ts, web/src/core/filters/run.test.ts, web/src/core/filters/nonlinear/nonlinear5b.test.ts]
learn:
  oneSentence: Each pixel becomes the brightest value of its neighbors.
  howItWorks:
    - Take the window around the pixel.
    - Find the largest value in it.
    - Use it as the new pixel.
  academic: >-
    The maximum is the order statistic of the highest rank. It equals gray dilation with a flat
    square structuring element, and it is separable, so it costs O(k) per pixel.
  paramNotes:
    size: Width of the square window. Larger windows spread bright values further.
  tryThis:
    - Add salt-and-pepper noise with only pepper. Compare the max filter with the median.
    - Run the min filter and then the max filter with the same size. Small bright specks are gone, larger shapes stay. This is an opening.
  pitfalls:
    - Using it on salt noise. Every bright speck grows into a bright square.
  demos: [rank-stepper, line-profile]
related: [min, midpoint, rank-order, median]
docsPage: filters/nonlinear/max.md
