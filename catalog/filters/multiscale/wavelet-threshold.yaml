implementation: {path: engine/src/pixelnexus_engine/filters/wavelets.py, symbol: wavelet_threshold}
tests: [engine/tests/test_wavelets.py]
learn:
  oneSentence: Describe the image with wavelets, throw away the small wavelet coefficients that are mostly noise, and rebuild it.
  howItWorks:
    - Split the image into a small blurred copy and layers of detail at several sizes.
    - Noise makes many small detail values. Edges make a few large ones.
    - Set the small detail values to zero and keep the large ones.
    - Put the layers back together.
  academic: >-
    Orthogonal discrete wavelet transform with soft or hard thresholding of the detail
    subbands. Thresholds from the universal rule (VisuShrink), Stein's unbiased risk estimate
    with the hybrid rule (SureShrink) or a Bayesian rule for generalized Gaussian priors
    (BayesShrink). Noise from the median absolute deviation of the finest diagonal subband.
  paramNotes:
    wavelet: The shape of the building blocks.
    levels: How many sizes of detail are cleaned.
    rule: How the cut-off is chosen.
    mode: Whether kept details are also made smaller.
    sigma: How strong the noise is. 0 measures it.
    threshold: The cut-off for the fixed rule.
    border: How the image is extended past its edges.
    channelScope: Which part of the color image is cleaned.
  tryThis:
    - Open the Noise lab and compare VisuShrink with BayesShrink on Gaussian noise.
    - Switch to the Haar wavelet and look for blocky patches.
    - Try hard thresholding and look for isolated spots.
  pitfalls:
    - Salt and pepper noise. Single extreme pixels give large coefficients that pass the threshold. Use a median filter first.
  demos: [noise-lab]
related: [swt-denoise, wavelet-wiener, laplacian-pyramid, nlm, bilateral, wiener-denoise]
