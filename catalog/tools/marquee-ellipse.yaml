id: marquee-ellipse
name: Elliptical marquee
group: marquee
tier: core
engine: browser
phase: '4'
status: planned
params:
  - key: style
    label: Style
    type: select
    default: normal
    options:
      - {value: normal, label: Normal}
      - {value: ratio, label: Fixed ratio}
      - {value: size, label: Fixed size}
    description: How dragging sets the shape.
    effect: Normal follows the pointer. Fixed ratio keeps the width to height ratio. Fixed size places a shape of the given size at the pointer.
  - key: ratioWidth
    label: Ratio width
    type: number
    default: 1
    min: 0.01
    max: 1000
    step: 0.01
    description: Width part of the fixed ratio.
  - key: ratioHeight
    label: Ratio height
    type: number
    default: 1
    min: 0.01
    max: 1000
    step: 0.01
    description: Height part of the fixed ratio.
  - key: sizeWidth
    label: Width
    type: integer
    default: 64
    min: 1
    max: 16384
    unit: px
    description: Width of the fixed size.
  - key: sizeHeight
    label: Height
    type: integer
    default: 64
    min: 1
    max: 16384
    unit: px
    description: Height of the fixed size.
  - key: feather
    label: Feather
    type: number
    default: 0
    min: 0
    max: 250
    step: 0.5
    unit: px
    description: Softens the edge of the new selection.
    effect: About 95% of the change from selected to unselected happens within this distance on each side of the edge.
  - key: antiAlias
    label: Anti-alias
    type: boolean
    default: true
    description: Gives edge pixels a value for the part of them that the shape covers.
    effect: Curved and slanted edges look smooth instead of stepped.
