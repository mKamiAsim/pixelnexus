id: select-brightness
name: Select by brightness
group: color
tier: core
engine: browser
phase: '4'
status: implemented-tested
params:
  - key: low
    label: From
    type: integer
    default: 128
    min: 0
    max: 255
    description: Darkest brightness (BT.709 luma, 0 to 255) that is fully selected.
    effect: Lower values add darker pixels.
  - key: high
    label: To
    type: integer
    default: 255
    min: 0
    max: 255
    description: Brightest brightness (BT.709 luma, 0 to 255) that is fully selected.
    effect: Higher values add brighter pixels.
  - key: softness
    label: Softness
    type: number
    default: 16
    min: 0
    max: 128
    step: 1
    description: Brightness levels over which the selection fades outside the range.
    effect: Higher values give a smoother change at the ends of the range.
summary: "Selects pixels whose brightness lies in a range, with a soft fade outside it."
steps:
  - "Compute the BT.709 luma of each pixel, from 0 to 255."
  - "Select it fully when it lies between From and To."
  - "Outside the range, fade the selection to 0 over the softness, in luma levels."
implementation:
  path: "web/src/core/selection/range.ts"
  symbol: "selectBrightness"
tests:
  - "web/src/core/selection/selection.test.ts"
  - "web/tests/e2e/selection.spec.ts"
learn:
  oneSentence: "Select by brightness picks the pixels between two brightness levels."
  howItWorks:
    - "Brightness here is BT.709 luma, a weighted sum of red, green and blue."
    - "Pixels inside the range are fully selected."
    - "Softness fades the selection out over a few levels past each end of the range."
  tryThis:
    - "Select only the dark parts of an image and brighten them."
  pitfalls:
    - "Luma ignores color. A pure blue and a dark gray can have the same luma."
  demos: []
docsPage: "selection/color-range.md"
