id: lasso-magnetic
name: Magnetic lasso
group: lasso
tier: core
engine: browser
phase: '4'
status: implemented-tested
planNotes: Live wire on gradient cost.
params:
  - key: width
    label: Width
    type: integer
    default: 10
    min: 1
    max: 40
    unit: px
    description: How far from the pointer the tool looks for an edge.
  - key: contrast
    label: Contrast
    type: number
    default: 10
    min: 1
    max: 100
    step: 1
    unit: '%'
    description: The weakest edge the tool follows, in percent of the strongest edge in the image.
    effect: Higher values follow only clear edges.
  - key: spacing
    label: Anchor spacing
    type: integer
    default: 40
    min: 5
    max: 200
    unit: px
    description: The path length after which the tool fixes an anchor point by itself.
    effect: Shorter spacing keeps the path close to where you moved the pointer.
  - key: feather
    label: Feather
    type: number
    default: 0
    min: 0
    max: 250
    step: 0.5
    unit: px
    description: Softens the edge of the new selection.
    effect: About 95% of the change from selected to unselected happens within this distance on each side of the edge.
  - key: antiAlias
    label: Anti-alias
    type: boolean
    default: true
    description: Gives edge pixels a value for the part of them that the shape covers.
    effect: Curved and slanted edges look smooth instead of stepped.
summary: "Draws a selection path that clings to edges as you move along them."
steps:
  - "Find the largest Sobel gradient of luma in the image, Gmax, once."
  - "Snap the first click to the strongest edge within the width setting."
  - "As the pointer moves, snap it to the strongest edge within the width."
  - "Find the cheapest 8-connected path from the last anchor, where steps on strong edges are cheap."
  - "Fix an anchor when the path gets longer than the anchor spacing, or when you click."
  - "On closing, find a path back to the start that does not reuse the path so far."
  - "Fill the closed path as a polygon and combine it with the selection by the mode."
implementation:
  path: "web/src/core/selection/livewire.ts"
  symbol: "livePath"
tests:
  - "web/src/core/selection/livewire.test.ts"
  - "web/src/selection/gestures.test.ts"
references:
  - kind: "paper"
    text: "Mortensen, E. N. and Barrett, W. A. Intelligent Scissors for Image Composition. Proceedings of SIGGRAPH 95, 191 to 198, 1995."
    url: "https://history.siggraph.org/?p=118735"
learn:
  oneSentence: "The magnetic lasso follows the edge of an object while you move the pointer near it."
  howItWorks:
    - "Each pixel gets a cost: low on strong edges, high in flat areas."
    - "The path from the last anchor to the pointer is the one with the lowest total cost."
    - "So the path runs along edges, like a wire pulled onto them."
  academic: "This is a live wire, after the intelligent scissors of Mortensen and Barrett. The cost of a step is (0.1 + c(q)) times its length, where c(q) = 1 - G(q) / Gmax on edges and 1 elsewhere. Dijkstra's algorithm finds the cheapest path in a box around the anchor and the pointer."
  paramNotes:
    width: "How far from the pointer the tool looks for an edge to snap to."
    contrast: "Edges weaker than this share of the strongest edge are ignored."
    spacing: "After this much path, an anchor is fixed by itself, so the path does not jump."
  tryThis:
    - "Trace a disk in the Disks and dots test image. Move slowly around its edge."
    - "Raise the contrast on a noisy image so the path ignores the noise."
  pitfalls:
    - "Where two edges are close, the path can jump to the wrong one. Click to fix an anchor before that place."
  demos: []
docsPage: "selection/magnetic-lasso.md"
