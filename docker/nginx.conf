server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The studio loads nothing from other sites. It talks only to the local engine.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:8765 http://localhost:8765; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
