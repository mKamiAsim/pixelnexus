# Run the studio and the science engine in containers.
#   docker compose up --build
# Studio: http://localhost:8080   Engine: http://127.0.0.1:8765/api/v1/info
# Both ports are published on 127.0.0.1 only, so other machines cannot reach them.
name: pixelnexus

services:
  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      PIXELNEXUS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - engine
    restart: unless-stopped
