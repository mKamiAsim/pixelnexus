# Publishes the docs at the site root and the studio at /studio/.
# Manual only until the project owner enables GitHub Pages (planning/PLAN.md, Phase 9 checkpoint).
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv sync --frozen
      - run: uv run python tools/gen_docs.py --check
      - run: uv run mkdocs build --strict
      - run: cp -r web/dist site/studio
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
