site_name: PixelNexus
site_description: Technical reference for the PixelNexus image processing studio.
site_url: https://mkamiasim.github.io/pixelnexus/
repo_url: https://github.com/mKamiAsim/pixelnexus
repo_name: mKamiAsim/pixelnexus
edit_uri: edit/main/docs/
copyright: PixelNexus contributors. MIT License.

# Pinned to MkDocs 1.6 and Material 9.7 (see planning/PLAN.md, risk R4).
# Keep this file free of plugins that would block a later move to Zensical.

exclude_docs: |
  _generated/
  _meta/

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs/_generated, "."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Development environment: getting-started/development-environment.md
      - Configuration: getting-started/configuration.md
      - Running tests: getting-started/running-tests.md
  - User guide:
      - The workspace: user-guide/workspace.md
      - Panels: user-guide/panels.md
      - The Learn panel: user-guide/learn-panel.md
      - Export: user-guide/export.md
      - Keyboard shortcuts: user-guide/keyboard-shortcuts.md
  - Selections:
      - selection/index.md
      - Marquee: selection/marquee.md
      - Lasso: selection/lasso.md
      - Magnetic lasso: selection/magnetic-lasso.md
      - Selection brush and eraser: selection/selection-brush.md
      - Magic Wand: selection/magic-wand.md
      - Color Range and tone: selection/color-range.md
      - Quick Selection: selection/quick-selection.md
      - Snap to edges: selection/snap-to-edges.md
      - Subject and background: selection/subject.md
  - Architecture:
      - Frontend architecture: architecture/frontend-architecture.md
      - Image data model: architecture/image-data-model.md
      - Preview and rendering: architecture/preview-and-rendering.md
      - Filter catalog and registry: architecture/filter-catalog.md
      - Processing pipeline: architecture/processing-pipeline.md
      - Selection and masking: architecture/selection-and-masking.md
      - Execution model: architecture/execution-model.md
      - Learn panel architecture: architecture/learn-panel.md
  - Mathematics:
      - Foundations: mathematics/foundations.md
      - Image representation: mathematics/image-representation.md
      - Convolution and correlation: mathematics/convolution-and-correlation.md
      - Boundary conditions: mathematics/boundary-conditions.md
      - Linearity and superposition: mathematics/linearity-and-superposition.md
      - Masks and alpha blending: mathematics/masks-and-alpha-blending.md
      - Numerical precision: mathematics/numerical-precision.md
  - Mathematical Inspector:
      - The Inspector: mathematical-inspector/overview.md
      - Kernel generation: mathematical-inspector/kernel-generation.md
      - Formula rendering: mathematical-inspector/formula-rendering.md
      - Parameter synchronization: mathematical-inspector/parameter-synchronization.md
      - Developer mode: mathematical-inspector/developer-mode.md
  - Filters:
      - filters/index.md
      - Linear:
          - Box filter: filters/linear/box.md
          - Gaussian filter: filters/linear/gaussian.md
          - Weighted average filter: filters/linear/weighted-average.md
          - Binomial filter: filters/linear/binomial.md
          - Triangular filter: filters/linear/triangular.md
          - Disk averaging filter: filters/linear/disk-average.md
          - Low-pass FIR filter: filters/linear/fir-lowpass.md
          - Motion blur: filters/linear/motion-blur.md
          - Laplacian: filters/linear/laplacian.md
          - Laplacian sharpening: filters/linear/laplacian-sharpen.md
          - High-pass filter: filters/linear/high-pass.md
          - High-boost filter: filters/linear/high-boost.md
          - Unsharp mask: filters/linear/unsharp-mask.md
      - Nonlinear:
          - Median filter: filters/nonlinear/median.md
      - Edges:
          - Sobel: filters/edges/sobel.md
      - Enhancement:
          - Gamma correction: filters/enhancement/gamma.md
          - Grayscale conversion: filters/enhancement/grayscale.md
      - Utility:
          - Add Gaussian noise: filters/utility/noise-gaussian.md
          - Add salt-and-pepper noise: filters/utility/noise-salt-pepper.md
